<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a12">
<title>Ficha D&D</title>
<style>
:root{
  --bg:#0a0a12; --panel:#181822; --panel2:#22222e; --panel3:#2c2c3a;
  --input-bg:#0d0d15; --border:#3a3a4a; --border-soft:#2a2a36;
  --text:#f0f0f5; --text-dim:#b8b8c4; --muted:#8a8a9a;
  --accent:#e8b93a; --accent-dim:#a8842a;
  --hp:#ff5252; --hp-low:#ff2020; --temp:#4dc0ff; --heal:#4ade80;
  --slot:#a583ff; --slot-empty:#1c1c28;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --c-action:#6ba4e8; --c-bonus:#b48ae8; --c-reaction:#e8996b;
  --c-attack:#e86b6b; --c-cantrip:#6be8b4; --c-spell:#e8b93a; --c-item:#9a9aab;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;line-height:1.4;overscroll-behavior:none;min-height:100vh}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation}
input,textarea,select{font-family:inherit;color:inherit;font-size:15px}

#wallpaper{position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 20% 10%, #1a1a30 0%, #0a0a12 60%);background-size:cover;background-position:center;transition:background-image .4s ease}
#wall-overlay{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg, rgba(0,0,0,.6) 0%, rgba(0,0,0,.82) 100%)}

header{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(10,10,18,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.head-info{flex:1;min-width:0;text-align:center}
.head-info .name{font-size:15px;font-weight:700;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head-info .sub{font-size:11px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head-info .camp{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.icon-btn{font-size:18px;padding:8px 10px;border-radius:10px;background:var(--panel2);border:1px solid var(--border);line-height:1;flex-shrink:0;color:var(--text);transition:transform .15s, background .15s}
.icon-btn:active{transform:scale(.92);background:rgba(232,185,58,.25)}

.layout{display:grid;grid-template-columns:1fr;gap:10px;padding:10px;max-width:1500px;margin:0 auto;min-height:calc(100vh - 50px)}
@media(min-width:900px){
  .layout{grid-template-columns: var(--left-w, 300px) 1fr var(--right-w, 320px);align-items:start;transition:grid-template-columns .25s ease}
  .layout.hide-left{--left-w:0px} .layout.hide-right{--right-w:0px}
  .layout.left-compact{--left-w:64px} .layout.right-compact{--right-w:64px}
  .layout.hide-left #leftPanel, .layout.hide-right #rightPanel{display:none}
}

aside{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:0;overflow:hidden;transition:transform .3s cubic-bezier(.32,.72,.3,1), opacity .25s}
@media(max-width:899px){
  aside{position:fixed;top:56px;bottom:0;width:min(88vw,340px);z-index:40;border-radius:16px;margin:8px;overflow-y:auto}
  aside#leftPanel{left:0;transform:translateX(-110%)}
  aside#rightPanel{right:0;transform:translateX(110%)}
  aside.open{transform:translateX(0)} aside.closed{pointer-events:none}
}
@media(min-width:900px){aside{position:sticky;top:64px;max-height:calc(100vh - 74px);overflow-y:auto;transition:width .25s ease}}

@media(min-width:900px){
  aside.compact{width:64px !important;min-width:64px;overflow:hidden}
  aside.compact .side-title{font-size:0}
  aside.compact .side-title::before{content:"•";font-size:18px;color:var(--accent)}
  aside.compact .side-head{justify-content:center;padding:12px 6px}
  aside.compact .side-close{display:none}
  aside.compact #leftContent .section{padding:6px 4px}
  aside.compact #leftContent .section-title{display:none}
  aside.compact #leftContent .stats-grid{grid-template-columns:1fr;gap:4px}
  aside.compact #leftContent .stat{padding:5px 2px}
  aside.compact #leftContent .stat .k{font-size:7px;letter-spacing:0}
  aside.compact #leftContent .stat .v{font-size:15px;margin:1px 0}
  aside.compact #leftContent .stat .m{font-size:10px}
  aside.compact #leftContent .skill,aside.compact #leftContent .section:last-child{display:none}
  aside.compact #rightContent .menu-sub{font-size:10px;padding:0;margin:6px 8px;text-align:center;background:var(--panel3);border-radius:10px;cursor:pointer;font-weight:800;letter-spacing:0.3px;text-transform:uppercase;color:#0a0a12;display:flex;align-items:center;justify-content:center;min-height:44px;border:2px solid transparent;transition:transform .15s, filter .15s, box-shadow .15s}
  aside.compact #rightContent .menu-sub:active{transform:scale(.93);filter:brightness(1.15);box-shadow:0 0 12px currentColor}
  aside.compact #rightContent .menu-sub[data-kind="action"]{background:var(--c-action)}
  aside.compact #rightContent .menu-sub[data-kind="bonus"]{background:var(--c-bonus)}
  aside.compact #rightContent .menu-sub[data-kind="reaction"]{background:var(--c-reaction)}
  aside.compact #rightContent .menu-sub[data-kind="attack"]{background:var(--c-attack)}
  aside.compact #rightContent .menu-sub[data-kind="cantrip"]{background:var(--c-cantrip)}
  aside.compact #rightContent .menu-sub[data-kind="spell"]{background:var(--c-spell)}
  aside.compact #rightContent .menu-sub[data-kind="item"]{background:var(--c-item)}
  aside.compact #rightContent .menu-sub .ms-full{display:none}
  aside.compact #rightContent .menu-sub .ms-compact{display:inline}
  aside.compact #rightContent .menu-item{display:none}
  aside.compact #rightContent .filter-back{display:none}
  aside.compact #rightContent .new-entry-btn{font-size:0;padding:0;margin:8px;width:calc(100% - 16px);min-height:40px;display:flex;align-items:center;justify-content:center}
  aside.compact #rightContent .new-entry-btn::before{content:"+";font-size:22px;font-weight:800;line-height:1}
}

.menu-sub .ms-compact{display:none}
.filter-back{margin:10px 14px;padding:8px 12px;width:calc(100% - 28px);border-radius:10px;background:var(--panel3);border:1px solid var(--border);color:var(--text-dim);font-weight:700;font-size:12px;text-align:left;transition:background .15s, color .15s}
.filter-back:active{background:rgba(232,185,58,.2);color:var(--accent)}

#backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:35;backdrop-filter:blur(2px)}
#backdrop.show{display:block}

.side-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--panel);z-index:2}
.side-title{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--accent)}
.side-close{font-size:16px;padding:4px 8px;color:var(--muted)}
@media(min-width:900px){.side-close{display:none}}

.section{padding:10px 14px;border-bottom:1px solid var(--border-soft)}
.section:last-child{border-bottom:none}
.section-title{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:6px}

.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat{background:var(--panel3);border:1px solid var(--border);border-radius:10px;padding:6px 4px;text-align:center}
.stat .k{font-size:9px;text-transform:uppercase;color:var(--muted);letter-spacing:.5px;font-weight:700}
.stat .v{font-size:18px;font-weight:800;margin:2px 0;color:var(--text)}
.stat .m{font-size:12px;color:var(--accent);font-weight:700}

.skill{display:grid;grid-template-columns:14px 1fr auto;align-items:center;gap:6px;padding:7px 4px;border-radius:8px;cursor:pointer;font-size:13px;transition:background .15s}
.skill:hover{background:rgba(255,255,255,.05)}
.skill:active{background:rgba(232,185,58,.15)}
.skill .dot{font-size:9px;text-align:center;color:var(--muted)}
.skill.prof .dot{color:var(--heal)}
.skill.exp .dot{color:var(--accent)}
.skill .b{font-weight:700;color:var(--text-dim);font-variant-numeric:tabular-nums}
.skill.prof .b,.skill.exp .b{color:var(--text)}

.menu-sub{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--accent);padding:12px 14px 6px;margin-top:2px;background:rgba(232,185,58,.04);cursor:pointer;transition:background .15s}
.menu-sub:active{background:rgba(232,185,58,.15)}

.menu-item{display:flex;align-items:center;gap:8px;padding:11px 14px;cursor:pointer;font-size:14px;border-bottom:1px solid var(--border-soft);transition:background .15s}
.menu-item:last-child{border-bottom:none}
.menu-item:hover{background:rgba(255,255,255,.04)}
.menu-item:active{background:rgba(232,185,58,.2)}
.menu-item .mi-name{flex:1;font-weight:600;color:var(--text)}
.menu-item .mi-formula{font-family:var(--mono);font-size:11px;color:var(--text-dim)}
.menu-item .mi-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.menu-item.kind-action .mi-dot{background:var(--c-action)}
.menu-item.kind-bonus .mi-dot{background:var(--c-bonus)}
.menu-item.kind-reaction .mi-dot{background:var(--c-reaction)}
.menu-item.kind-attack .mi-dot{background:var(--c-attack)}
.menu-item.kind-cantrip .mi-dot{background:var(--c-cantrip)}
.menu-item.kind-spell .mi-dot{background:var(--c-spell)}
.menu-item.kind-item .mi-dot{background:var(--c-item)}

.new-entry-btn{margin:10px 14px;padding:10px;width:calc(100% - 28px);border-radius:10px;background:var(--panel3);border:1px dashed var(--border);color:var(--text-dim);font-weight:700;font-size:13px}
.new-entry-btn:active{background:rgba(232,185,58,.2);color:var(--accent)}

main.center{display:flex;flex-direction:column;gap:12px;min-width:0}
.portrait-wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.portrait{width:150px;height:150px;border-radius:50%;background:var(--panel2);border:3px solid rgba(255,255,255,.2);box-shadow:0 8px 30px rgba(0,0,0,.6), inset 0 0 40px rgba(0,0,0,.5);background-size:cover;background-position:center;cursor:pointer;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:40px;color:var(--muted);transition:transform .2s}
.portrait:active{transform:scale(.95)}
.portrait::after{content:"📷";position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.85);border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:14px;opacity:.9}

.vitals{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:14px}
.hp-label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:6px;font-weight:700}
.hp-row{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:10px}
.hp-input{font-family:var(--font);font-size:52px;font-weight:800;line-height:1;background:var(--input-bg);border:2px solid var(--border);border-radius:12px;color:var(--hp);text-align:center;width:auto;min-width:80px;max-width:130px;padding:2px 8px;font-variant-numeric:tabular-nums;outline:none;-moz-appearance:textfield;transition:border-color .15s}
.hp-input::-webkit-outer-spin-button,.hp-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.hp-input:focus{border-color:var(--accent)}
.hp-input.low{color:var(--hp-low);animation:pulse 1.2s infinite}
.hp-input.temp{color:var(--temp)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
.hp-sep{font-size:30px;color:var(--muted);font-weight:300}
.hp-max{font-family:var(--font);font-size:24px;font-weight:700;background:var(--input-bg);border:2px solid var(--border);border-radius:10px;color:var(--text-dim);width:70px;padding:4px 6px;text-align:center;outline:none;-moz-appearance:textfield;transition:border-color .15s}
.hp-max::-webkit-outer-spin-button,.hp-max::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.hp-max:focus{border-color:var(--accent)}
.hp-temp{font-size:20px;font-weight:700;color:var(--temp);font-family:var(--font);background:var(--input-bg);border:2px solid var(--border);border-radius:10px;width:60px;text-align:center;padding:4px 2px;outline:none;-moz-appearance:textfield;transition:border-color .15s}
.hp-temp::-webkit-outer-spin-button,.hp-temp::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.hp-temp:focus{border-color:var(--accent)}
.hp-temp::placeholder{color:var(--muted);font-size:14px}

.mini-vitals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.mini{background:var(--panel3);border:1px solid var(--border);border-radius:10px;padding:8px 4px;text-align:center}
.mini .k{font-size:9px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700}
.mini .v{font-size:20px;font-weight:800;margin-top:2px;font-family:var(--font);background:var(--input-bg);border:1px solid var(--border);border-radius:6px;color:var(--text);width:100%;text-align:center;padding:2px 0;outline:none;-moz-appearance:textfield;transition:border-color .15s}
.mini .v::-webkit-outer-spin-button,.mini .v::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.mini .v:focus{border-color:var(--accent)}

.quick-bar{display:flex;gap:8px;overflow-x:auto;padding:0 4px 4px;scrollbar-width:none}
.quick-bar::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:8px 12px;display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;min-height:38px;transition:transform .15s, background .15s}
.chip:active{transform:scale(.95);background:rgba(232,185,58,.25)}
.chip .ci{font-size:14px;color:var(--c-reaction)}
.chip .ct{font-weight:600}

.slots-block{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:12px 14px}
.slot-line{display:flex;align-items:center;gap:10px;padding:6px 0}
.slot-level{font-size:12px;font-weight:700;color:var(--text-dim);min-width:60px}
.slot-pips{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.pip{width:22px;height:22px;border-radius:6px;border:2px solid var(--slot);background:var(--slot-empty);transition:background .15s, transform .1s;cursor:pointer}
.pip:active{transform:scale(.9)}
.pip.used{background:var(--slot);opacity:.35;border-color:var(--slot)}
.pip.free{background:var(--slot-empty);border-color:var(--slot)}
.slot-count{font-size:11px;color:var(--text-dim);font-variant-numeric:tabular-nums;font-weight:700}

.detail-stack{display:flex;flex-direction:column;gap:10px}
.detail{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:14px 16px;animation:slideDown .25s ease;position:relative}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.detail.pinned{border-color:rgba(232,185,58,.6);box-shadow:0 0 0 1px rgba(232,185,58,.2), 0 8px 24px rgba(0,0,0,.5)}
.detail-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.detail-title{flex:1;font-size:18px;font-weight:800;color:var(--accent);line-height:1.2}
.detail-sub{font-size:12px;color:var(--text-dim);margin-top:2px}
.detail-actions{display:flex;gap:4px}
.pin-btn,.close-btn,.edit-btn{font-size:15px;padding:6px 8px;border-radius:8px;background:var(--panel3);color:var(--text-dim);border:1px solid var(--border);transition:background .15s, color .15s}
.pin-btn:active,.close-btn:active,.edit-btn:active{transform:scale(.9)}
.pin-btn.on{background:rgba(232,185,58,.3);color:var(--accent);border-color:var(--accent)}

.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tag{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px;border:1px solid transparent}
.tag.action{background:#1e3a5f;color:#a8caf0;border-color:#2c5688}
.tag.bonus{background:#3d2a5f;color:#d0b0f0;border-color:#5a4088}
.tag.reaction{background:#5f3a1e;color:#f0c8a0;border-color:#8a5630}
.tag.attack{background:#5f1e1e;color:#f0a8a8;border-color:#8a3030}
.tag.cantrip{background:#1e5f4a;color:#a8f0d0;border-color:#308868}
.tag.spell{background:#5f4a1e;color:#f0dca0;border-color:#8a7030}
.tag.item{background:#3a3a48;color:#c8c8d8;border-color:#565666}
.tag.conc{background:#5f1e5f;color:#e0a8e0;border-color:#883088}
.tag.restore{background:#1e4a5f;color:#a8dcf0;border-color:#2c6888}

.formula-box{background:rgba(0,0,0,.45);border:1px solid var(--border);border-radius:10px;padding:12px;font-family:var(--mono);font-size:15px;text-align:center;color:var(--accent);font-weight:800;letter-spacing:.5px;margin:8px 0 12px}
.detail-desc{font-size:13.5px;line-height:1.6;color:var(--text);opacity:.95;white-space:pre-wrap}
.detail-meta{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 14px;margin:10px 0;font-size:12px}
.detail-meta .mk{color:var(--muted)}
.detail-meta .mv{color:var(--text);font-weight:600}

.uses-block{margin-top:12px;padding:10px 12px;background:rgba(0,0,0,.3);border:1px solid var(--border-soft);border-radius:12px}
.uses-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.uses-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text-dim)}
.uses-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.uses-pips{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.uses-pips .pip{width:20px;height:20px}
.uses-pips .pip.used{background:var(--slot);opacity:.35}
.uses-pips .pip.free{background:var(--slot-empty);border-color:var(--slot)}
.uses-count{font-size:11px;color:var(--text-dim);font-weight:700;font-variant-numeric:tabular-nums}
.use-btn{padding:7px 14px;border-radius:8px;background:var(--accent);color:#0a0a12;font-weight:800;font-size:12px;border:none;letter-spacing:.4px;text-transform:uppercase;transition:transform .1s, filter .15s;flex-shrink:0}
.use-btn:active{transform:scale(.95);filter:brightness(1.1)}
.use-btn:disabled{background:var(--panel3);color:var(--muted);cursor:not-allowed;opacity:.6}
.use-btn.full{background:var(--slot);color:#fff}
.restore-hint{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:6px;font-weight:700}

.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px}
.empty .big{font-size:32px;margin-bottom:12px;opacity:.4}

.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.modal.open{display:flex}
.modal-content{background:var(--panel);border:1px solid var(--border);width:100%;max-width:640px;max-height:88vh;border-radius:16px;padding:18px;overflow-y:auto}
.modal-title{font-size:16px;font-weight:800;color:var(--accent);margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);margin-bottom:5px;font-weight:700}
.field input,.field textarea,.field select{width:100%;background:var(--input-bg);border:1px solid var(--border);border-radius:10px;padding:10px;font-size:14px;color:var(--text);outline:none;transition:border-color .15s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.field textarea{font-family:var(--mono);font-size:12px;min-height:40vh;resize:vertical;line-height:1.5}
.field textarea.short{min-height:100px;font-family:var(--font);font-size:13px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field-hint{font-size:11px;color:var(--muted);margin-top:4px}
.btn{padding:11px 14px;border-radius:10px;font-weight:700;font-size:13px;background:var(--panel3);border:1px solid var(--border);color:var(--text);min-height:44px;transition:transform .1s, filter .15s}
.btn:active{transform:scale(.97);filter:brightness(1.2)}
.btn.primary{background:var(--accent);color:#0a0a12;border-color:var(--accent)}
.btn.danger{background:rgba(255,82,82,.25);color:#ffb0b0;border-color:rgba(255,82,82,.5)}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.btn-row.wide{grid-template-columns:1fr}
.btn-row.triple{grid-template-columns:1fr 1fr 1fr}

/* CHAR LIST */
.char-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;max-height:55vh;overflow-y:auto}
.char-group-label{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--accent);padding:10px 4px 4px;margin-top:6px;border-bottom:1px solid var(--border-soft)}
.char-group-label:first-child{margin-top:0;padding-top:0}
.char-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel3);border:1px solid var(--border);border-radius:10px;cursor:pointer;text-align:left;transition:border-color .15s, background .15s}
.char-item:active{filter:brightness(1.15)}
.char-item.active{border-color:var(--accent);background:rgba(232,185,58,.1)}
.char-item .ci-type{font-size:9px;padding:2px 6px;border-radius:6px;background:var(--panel2);color:var(--muted);text-transform:uppercase;font-weight:800;flex-shrink:0}
.char-item .ci-type.pc{background:rgba(39,174,96,.3);color:#a8f0c0}
.char-item .ci-type.npc{background:rgba(231,76,60,.3);color:#f0b0a8}
.char-item .ci-info{flex:1;min-width:0}
.char-item .ci-name{font-weight:700;color:var(--text);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.char-item .ci-sub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.char-item .ci-hp{font-size:12px;font-weight:800;color:var(--hp);font-variant-numeric:tabular-nums;flex-shrink:0}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent);color:#0a0a12;padding:10px 20px;border-radius:24px;font-weight:800;font-size:13px;z-index:200;opacity:0;transition:opacity .3s, transform .3s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
</style>
</head>
<body>

<div id="wallpaper"></div>
<div id="wall-overlay"></div>

<header>
  <button class="icon-btn" data-action="toggle-left">☰</button>
  <div class="head-info">
    <div class="name" id="hName">—</div>
    <div class="sub" id="hSub">—</div>
    <div class="camp" id="hCamp">—</div>
  </div>
  <button class="icon-btn" data-action="open-chars" title="Personajes">👥</button>
  <button class="icon-btn" data-action="toggle-right">☰</button>
  <button class="icon-btn" data-action="open-settings" title="Ajustes">⚙</button>
</header>

<div id="backdrop"></div>

<div class="layout">
  <aside id="leftPanel" class="closed">
    <div class="side-head">
      <span class="side-title">Estadísticas</span>
      <button class="side-close" data-action="close-panels">✕</button>
    </div>
    <div id="leftContent"></div>
  </aside>

  <main class="center">
    <div class="portrait-wrap">
      <div class="portrait" id="portrait" data-action="change-portrait">🛡️</div>
    </div>

    <div class="vitals">
      <div class="hp-label">Puntos de golpe</div>
      <div class="hp-row">
        <input class="hp-input" id="hpCur" type="number" inputmode="numeric" title="PG actuales">
        <span class="hp-sep">/</span>
        <input class="hp-max" id="hpMax" type="number" inputmode="numeric" title="PG máximos">
        <input class="hp-temp" id="hpTemp" type="number" inputmode="numeric" placeholder="+0" title="PG temporales">
      </div>
      <div class="mini-vitals">
        <div class="mini"><div class="k">CA</div><input class="v" id="acVal" type="number" inputmode="numeric"></div>
        <div class="mini"><div class="k">Inic</div><input class="v" id="iniVal" type="number" inputmode="numeric"></div>
        <div class="mini"><div class="k">Vel</div><input class="v" id="velVal" type="number" inputmode="numeric"></div>
      </div>
    </div>

    <div id="quickBar" class="quick-bar"></div>
    <div id="slotsBlock"></div>
    <div id="detailStack" class="detail-stack"></div>
    <div id="restBlock"></div>
  </main>

  <aside id="rightPanel" class="closed">
    <div class="side-head">
      <span class="side-title">Acciones</span>
      <button class="side-close" data-action="close-panels">✕</button>
    </div>
    <div id="rightContent"></div>
  </aside>
</div>

<!-- SETTINGS MODAL -->
<div class="modal" id="settingsModal">
  <div class="modal-content">
    <div class="modal-title">
      <span>Ajustes</span>
      <button class="icon-btn" data-action="close-settings">✕</button>
    </div>
    <div class="field">
      <label>Campaña (etiqueta)</label>
      <input type="text" id="setCampaign" placeholder="Ej: Tomb of Annihilation, Homebrew 2025...">
      <div class="field-hint">Aparece bajo el nombre. Sirve para agrupar personajes.</div>
    </div>
    <div class="field">
      <label>Imagen del personaje (URL)</label>
      <input type="url" id="setPortrait" placeholder="https://... o vacío">
      <div class="btn-row" style="margin-top:6px">
        <button class="btn" data-action="upload-portrait">📁 Subir</button>
        <button class="btn" data-action="clear-portrait">🗑 Quitar</button>
      </div>
    </div>
    <div class="field">
      <label>Fondo (URL)</label>
      <input type="url" id="setWallpaper" placeholder="https://... o vacío">
      <div class="btn-row" style="margin-top:6px">
        <button class="btn" data-action="upload-wallpaper">📁 Subir</button>
        <button class="btn" data-action="clear-wallpaper">🗑 Quitar</button>
      </div>
    </div>
    <div class="field">
      <label>Icono de pestaña (emoji)</label>
      <input type="text" id="setIcon" maxlength="4" placeholder="🧪" style="font-size:24px;text-align:center">
      <div class="field-hint">Un emoji que aparecerá como ícono en la pestaña del navegador</div>
    </div>
    <div class="field">
      <label>Datos JSON de este personaje</label>
      <textarea id="jsonArea" spellcheck="false"></textarea>
    </div>
    <div class="btn-row">
      <button class="btn primary" data-action="apply-json">Aplicar</button>
      <button class="btn" data-action="download-json">Descargar</button>
      <button class="btn" data-action="import-json">Importar</button>
      <button class="btn" data-action="copy-json">Copiar</button>
    </div>
    <div class="btn-row wide">
      <button class="btn danger" data-action="reset-char">Restaurar ejemplo</button>
    </div>
    <input type="file" id="fileImport" accept=".json" style="display:none">
    <input type="file" id="filePortrait" accept="image/*" style="display:none">
    <input type="file" id="fileWallpaper" accept="image/*" style="display:none">
  </div>
</div>

<!-- CHAR LIST MODAL -->
<div class="modal" id="charsModal">
  <div class="modal-content">
    <div class="modal-title">
      <span>Personajes</span>
      <button class="icon-btn" data-action="close-chars">✕</button>
    </div>
    <div id="charList" class="char-list"></div>
    <div class="btn-row">
      <button class="btn primary" data-action="new-pc">+ Nuevo PJ</button>
      <button class="btn" data-action="new-npc">+ Nuevo PNJ</button>
      <button class="btn" data-action="duplicate-char">Duplicar actual</button>
      <button class="btn danger" data-action="delete-char">Eliminar actual</button>
    </div>
  </div>
</div>

<!-- ENTRY FORM MODAL -->
<div class="modal" id="entryModal">
  <div class="modal-content">
    <div class="modal-title">
      <span id="entryFormTitle">Nueva entrada</span>
      <button class="icon-btn" data-action="close-entry-form">✕</button>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Tipo</label>
        <select id="fKind">
          <option value="action">Acción</option>
          <option value="bonus">Acción adicional</option>
          <option value="reaction">Reacción</option>
          <option value="attack">Ataque</option>
          <option value="cantrip">Truco</option>
          <option value="spell">Conjuro</option>
          <option value="item">Objeto</option>
        </select>
      </div>
      <div class="field">
        <label>Nivel (conjuros)</label>
        <input type="number" id="fLevel" min="0" max="9" value="0">
        <div class="field-hint">0 = no es conjuro</div>
      </div>
    </div>
    <div class="field"><label>Nombre</label><input type="text" id="fName" placeholder="Ej: Fire Bolt"></div>
    <div class="field"><label>Etiquetas (separadas por coma)</label><input type="text" id="fTags" placeholder="Truco, Ataque, Evocación"></div>
    <div class="field-row">
      <div class="field"><label>Fórmula</label><input type="text" id="fFormula" placeholder="1d20+6 · 1d10 fuego"></div>
      <div class="field"><label>Resumen corto</label><input type="text" id="fShort" placeholder="120 ft · Instantánea"></div>
    </div>
    <div class="field"><label>Descripción completa</label><textarea id="fDesc" class="short" placeholder="Efecto, salvación, condiciones..."></textarea></div>
    <div class="field-row">
      <div class="field"><label>Usos máximos (0 = sin usos)</label><input type="number" id="fUsesMax" min="0" value="0"></div>
      <div class="field">
        <label>Recarga en</label>
        <select id="fRestore">
          <option value="">— Sin usos / no aplica —</option>
          <option value="short">Descanso corto</option>
          <option value="long">Descanso largo</option>
          <option value="dawn">Al amanecer</option>
          <option value="never">Nunca (manual)</option>
        </select>
      </div>
    </div>
    <div class="btn-row triple">
      <button class="btn primary" data-action="save-entry">Guardar</button>
      <button class="btn danger" data-action="delete-entry" id="btnDeleteEntry" style="display:none">Eliminar</button>
      <button class="btn" data-action="close-entry-form">Cancelar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

  profBonus:2, saveProfs:[], skillProfs:[], skillExpertise:[],

const SKILLS = {
  acrobatics:{name:"Acrobacias",stat:"dex"}, animalHandling:{name:"Trato con animales",stat:"wis"},
  arcana:{name:"Arcanos",stat:"int"}, athletics:{name:"Atletismo",stat:"str"},

  insight:{name:"Perspicacia",stat:"wis"}, intimidation:{name:"Intimidación",stat:"cha"},

};
const STAT_NAMES = {str:"FUE",dex:"DES",con:"CON",int:"INT",wis:"SAB",cha:"CAR"};
const KIND_LABELS = { reaction:"Reacciones", bonus:"Acciones adicionales", action:"Acciones", attack:"Ataques", cantrip:"Trucos", spell:"Conjuros preparados", item:"Objetos" };
const KIND_SHORT = { reaction:"Reac", bonus:"Bonus", action:"Acción", attack:"Ataq", cantrip:"Truco", spell:"Conjuro", item:"Objeto" };
const KIND_ORDER = ["reaction","bonus","action","attack","cantrip","spell","item"];
const RESTORE_LABELS = { short:"Corto", long:"Largo", dawn:"Amanecer", never:"Manual" };

/* ============================================================
   ESTADO / DB
   ============================================================ */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

let DB = loadDB();
let C = DB.characters.find(c => c.id === DB.activeId) || DB.characters[0];
let UI = { activeDetail:null, pinnedDetails:[], panelOpen:null, editingId:null, rightFilter:null };

function clone(o){return JSON.parse(JSON.stringify(o))}
function deepMerge(t,s){
  for(const k in s){
    if(s[k] && typeof s[k]==="object" && !Array.isArray(s[k])) t[k] = deepMerge(t[k]||{}, s[k]);
    else t[k] = s[k];
  }
  return t;
}
function makePC(){
  const c = clone(DEFAULT_CHAR);
  c.id = uid(); c.type = "pc"; c.campaign = "";
  return c;
}
function makeNPC(){
  const c = clone(NPC_TEMPLATE);
  c.id = uid(); c.type = "npc";
  return c;
}
function loadDB(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const db = JSON.parse(raw);
      if(db && Array.isArray(db.characters) && db.characters.length) return db;
    }
    // Migrar desde v5 (un solo personaje)
    const old = localStorage.getItem(OLD_KEY);
    if(old){
      const c = deepMerge(clone(DEFAULT_CHAR), JSON.parse(old));
      c.id = uid(); c.type = "pc"; c.campaign = c.campaign || "";
      return { characters:[c], activeId:c.id };
    }
  }catch(e){ console.warn(e); }
  const c = makePC();
  return { characters:[c], activeId:c.id };
}
function save(){
  try{
    const i = DB.characters.findIndex(c => c.id === C.id);
    if(i >= 0) DB.characters[i] = C;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
  }catch(e){ console.warn("No se pudo guardar", e); }
}
function activeChar(){ return DB.characters.find(c => c.id === DB.activeId) || DB.characters[0]; }

const mod = n => Math.floor((n-10)/2);
const fmt = n => (n>=0?"+":"")+n;
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove("show"), 1800);
}
function findEntry(id){ return C.entries.find(e => e.id === id); }

/* ============================================================
   WALLPAPER / PORTRAIT / FAVICON
   ============================================================ */
function applyWallpaper(){
  const w = document.getElementById("wallpaper");
  if(C.wallpaper){ w.style.backgroundImage = `url("${C.wallpaper}")`; w.style.background = ""; }
  else { w.style.backgroundImage = ""; w.style.background = "radial-gradient(circle at 20% 10%, #1a1a30 0%, #0a0a12 60%)"; }
}
function applyPortrait(){
  const p = document.getElementById("portrait");
  if(C.portrait){ p.style.backgroundImage = `url("${C.portrait}")`; p.textContent = ""; }
  else { p.style.backgroundImage = ""; p.textContent = C.type === "npc" ? "👹" : "🛡️"; }
}
function applyFavicon(){
  const emoji = C.icon || (C.type === "npc" ? "👹" : "🎲");
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">${emoji}</text></svg>`;
  let link = document.querySelector("link[rel='icon']");
  if(!link){ link = document.createElement("link"); link.rel = "icon"; document.head.appendChild(link); }
  link.href = "data:image/svg+xml," + encodeURIComponent(svg);
}

   RENDER
   ============================================================ */
function renderHeader(){
  document.getElementById("hName").textContent = C.meta.name || "Sin nombre";
  document.getElementById("hSub").textContent = [C.meta.race, `${C.meta.class} ${C.meta.level}`, C.meta.alignment].filter(Boolean).join(" · ");
  const camp = document.getElementById("hCamp");
  camp.textContent = C.campaign ? `🏰 ${C.campaign}` : "";
  camp.style.display = C.campaign ? "block" : "none";
}

function renderVitals(){
  const hp = C.combat.hp;
  const cur = document.getElementById("hpCur"), max = document.getElementById("hpMax"), tmp = document.getElementById("hpTemp");
  if(document.activeElement !== cur) cur.value = hp.current;
  if(document.activeElement !== max) max.value = hp.max;
  if(document.activeElement !== tmp) tmp.value = hp.temp || "";
  cur.classList.remove("low","temp");
  const pct = hp.max > 0 ? (hp.current / hp.max) : 1;
  if(hp.temp > 0) cur.classList.add("temp");
  else if(pct < 0.25) cur.classList.add("low");
  document.getElementById("acVal").value = C.combat.ac;
  document.getElementById("iniVal").value = mod(C.stats.dex) + (C.combat.initiativeMisc||0);
  document.getElementById("velVal").value = C.combat.speed;
}

function renderLeft(){
  const el = document.getElementById("leftContent");
  const s = C.stats;
  let html = '<div class="section"><div class="section-title">Características</div><div class="stats-grid">';
  for(const k of ["str","dex","con","int","wis","cha"]){
    const m = mod(s[k]);
    html += `<div class="stat" title="Salvación: ${fmt(m + (C.saveProfs.includes(k)?C.profBonus:0))}">
      <div class="k">${STAT_NAMES[k]}</div><div class="v">${s[k]}</div><div class="m">${fmt(m)}</div>
    </div>`;
  }
  html += '</div></div>';
  html += '<div class="section"><div class="section-title">Habilidades</div>';
  for(const key in SKILLS){
    const sk = SKILLS[key];
    const base = mod(s[sk.stat]);
    const isP = C.skillProfs.includes(key), isE = C.skillExpertise.includes(key);
    const b = base + (isP?C.profBonus:0) + (isE?C.profBonus:0);
    const dot = isE ? "◆" : (isP ? "●" : "○");
    const cls = isE ? "exp" : (isP ? "prof" : "");
    html += `<div class="skill ${cls}"><span class="dot">${dot}</span><span>${sk.name}</span><span class="b">${fmt(b)}</span></div>`;
  }
  html += '</div>';
  html += `<div class="section"><div class="section-title">Otros</div>
    <div style="font-size:12px;color:var(--text-dim);line-height:1.9">
      Competencia: <b style="color:var(--text)">+${C.profBonus}</b><br>
      CD conjuro: <b style="color:var(--text)">14</b><br>
      Ataque conjuro: <b style="color:var(--text)">+6</b><br>
      Perc. pasiva: <b style="color:var(--text)">14</b>
    </div></div>`;
  el.innerHTML = html;
}

function renderRight(){
  const el = document.getElementById("rightContent");
  const groups = {};
  for(const e of C.entries){ if(!groups[e.kind]) groups[e.kind] = []; groups[e.kind].push(e); }

  const isCompact = document.getElementById("rightPanel").classList.contains("compact");
  const filter = UI.rightFilter;
  let html = "";

  if(filter && !isCompact){
    html += `<button class="filter-back" data-action="clear-filter">← Ver todas las secciones</button>`;
  }

  const kindsToShow = (filter && !isCompact) ? [filter] : KIND_ORDER;

  for(const kind of kindsToShow){
    const items = groups[kind];
    if(!items || !items.length) continue;
    html += `<div class="menu-sub" data-kind="${kind}" data-action="click-section" data-section="${kind}">
      <span class="ms-full">${KIND_LABELS[kind]} · ${items.length}</span>
      <span class="ms-compact">${KIND_SHORT[kind]}</span>
    </div>`;
    for(const e of items){
      html += `<div class="menu-item kind-${kind}" data-action="open-detail" data-id="${e.id}">
        <span class="mi-dot"></span>
        <span class="mi-name">${esc(e.name)}</span>
        ${e.formula ? `<span class="mi-formula">${esc(e.formula)}</span>` : ""}
      </div>`;
    }
  }
  html += `<button class="new-entry-btn" data-action="open-entry-form">+ Nueva entrada</button>`;
  el.innerHTML = html;
}

function renderQuickBar(){
  const el = document.getElementById("quickBar");
  const reactions = C.entries.filter(e => e.kind === "reaction");
  if(!reactions.length){ el.innerHTML = ""; return; }
  el.innerHTML = reactions.map(e => `
    <button class="chip" data-action="open-detail" data-id="${e.id}">
      <span class="ci">⚡</span><span class="ct">${esc(e.name)}</span>
    </button>
  `).join("");
}

function renderSlots(){
  const el = document.getElementById("slotsBlock");
  let html = "";
  for(let lvl=1; lvl<=9; lvl++){
    const s = C.spellSlots[lvl];
    if(!s || s.max === 0) continue;
    html += `<div class="slot-line">
      <span class="slot-level">Nivel ${lvl}</span>
      <div class="slot-pips">${Array.from({length:s.max},(_,i)=>`<button class="pip ${i<s.used?'used':'free'}" data-action="toggle-slot" data-level="${lvl}" data-idx="${i}"></button>`).join("")}</div>
      <span class="slot-count">${s.max-s.used}/${s.max}</span>
    </div>`;
  }
  if(!html){ el.className = ""; el.innerHTML = ""; return; }
  el.className = "slots-block";
  el.innerHTML = `<div class="section-title" style="margin-bottom:6px">Espacios de conjuro</div>${html}`;
}

function renderDetailStack(){
  const el = document.getElementById("detailStack");
  const items = [];
  for(const id of UI.pinnedDetails){
    const e = findEntry(id);
    if(e) items.push({entry:e, pinned:true});
  }
  if(UI.activeDetail && !UI.pinnedDetails.includes(UI.activeDetail)){
    const e = findEntry(UI.activeDetail);
    if(e) items.push({entry:e, pinned:false});
  }
  if(!items.length){ el.innerHTML = ""; return; }
  el.innerHTML = items.map(it => renderDetailHTML(it.entry, it.pinned)).join("");
}

function renderDetailHTML(e, pinned){
  const kindLabel = KIND_LABELS[e.kind] || e.kind;
  const tags = (e.tags||[]).map(t => {
    const l = t.toLowerCase();
    let cls = "item";
    if(l.includes("concentración")) cls = "conc";
    else if(l.includes("reacción")) cls = "reaction";
    else if(l.includes("bonus")) cls = "bonus";
    else if(l.includes("ataque")) cls = "attack";
    else if(l.includes("truco")) cls = "cantrip";
    else if(l.includes("conjuro")||l.includes("nivel")) cls = "spell";
    else if(l.includes("acción")) cls = "action";
    return `<span class="tag ${cls}">${esc(t)}</span>`;
  }).join("");

  let restoreTag = "";
  if(e.uses && e.restore){
    restoreTag = `<span class="tag restore">↻ ${RESTORE_LABELS[e.restore]||e.restore}</span>`;
  }

  let slotBlock = "";
  if((e.kind === "spell" || e.kind === "cantrip") && e.level >= 1){
    const pool = C.spellSlots[e.level];
    if(pool && pool.max > 0){
      const free = pool.max - pool.used;
      const canUse = free > 0;
      slotBlock = `<div class="uses-block">
        <div class="uses-head">
          <span class="uses-title">Espacios nivel ${e.level}</span>
          <span class="uses-count">${free}/${pool.max} libres</span>
        </div>
        <div class="uses-controls">
          <div class="uses-pips">
            ${Array.from({length:pool.max},(_,i)=>`<button class="pip ${i<pool.used?'used':'free'}" data-action="toggle-slot" data-level="${e.level}" data-idx="${i}"></button>`).join("")}
          </div>
          <button class="use-btn" data-action="use-slot" data-id="${e.id}" data-level="${e.level}" ${canUse?"":"disabled"}>Usar</button>
        </div>
        <div class="restore-hint">↻ Se restaura con descanso largo</div>
      </div>`;
    }
  }

  let usesBlock = "";
  if(e.uses){
    const free = e.uses.current;
    const canUse = free > 0;
    usesBlock = `<div class="uses-block">
      <div class="uses-head">
        <span class="uses-title">Usos propios</span>
        <span class="uses-count">${free}/${e.uses.max} disponibles</span>
      </div>
      <div class="uses-controls">
        <div class="uses-pips">
          ${Array.from({length:e.uses.max},(_,i)=>`<button class="pip ${i<free?'free':'used'}" data-action="toggle-use" data-id="${e.id}" data-idx="${i}"></button>`).join("")}
        </div>
        <button class="use-btn full" data-action="use-charge" data-id="${e.id}" ${canUse?"":"disabled"}>Usar</button>
      </div>
      ${e.restore ? `<div class="restore-hint">↻ Se restaura con descanso ${RESTORE_LABELS[e.restore]||e.restore}</div>` : ""}
    </div>`;
  }

  let metaHTML = "";
  if(e.meta){
    const rows = Object.entries(e.meta).filter(([k,v]) => v).map(([k,v]) => `<div><span class="mk">${esc(k)}:</span> <span class="mv">${esc(v)}</span></div>`).join("");
    if(rows) metaHTML = `<div class="detail-meta">${rows}</div>`;
  }

  return `<div class="detail ${pinned?'pinned':''}">
    <div class="detail-head">
      <div style="flex:1">
        <div class="detail-title">${esc(e.name)}</div>
        <div class="detail-sub">${esc(kindLabel)}${e.short ? " · " + esc(e.short) : ""}</div>
      </div>
      <div class="detail-actions">
        <button class="edit-btn" data-action="edit-entry" data-id="${e.id}" title="Editar">✏️</button>
        <button class="pin-btn ${pinned?'on':''}" data-action="pin-detail" data-id="${e.id}" title="${pinned?'Desfijar':'Fijar'}">📌</button>
        ${!pinned?`<button class="close-btn" data-action="close-detail" data-id="${e.id}" title="Cerrar">✕</button>`:""}
      </div>
    </div>
    ${tags||restoreTag ? `<div class="tag-row">${tags}${restoreTag}</div>` : ""}
    ${e.formula ? `<div class="formula-box">${esc(e.formula)}</div>` : ""}
    ${slotBlock}${usesBlock}${metaHTML}
    ${e.description ? `<div class="detail-desc">${esc(e.description)}</div>` : ""}
  </div>`;
}

function renderRest(){
  const el = document.getElementById("restBlock");
  const hd = C.combat.hitDice;
  el.innerHTML = `<div class="vitals">
    <div class="section-title" style="margin-bottom:8px">Descansos y recursos</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">

      Agotamiento: <b style="color:var(--text)">${C.combat.exhaustion}/6</b><br>
      Inspiración: <b style="color:var(--text)">${C.combat.inspiration ? '★ Sí' : '☆ No'}</b>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px">
      <button class="btn" data-action="toggle-inspiration">${C.combat.inspiration ? '★ Quitar insp.' : '☆ Dar inspiración'}</button>
      <button class="btn" data-action="hd-minus">−1 dado de golpe</button>
    </div>

function renderAll(){
  renderHeader(); renderVitals(); renderLeft(); renderRight();
  renderQuickBar(); renderSlots(); renderDetailStack(); renderRest();
  applyWallpaper(); applyPortrait(); applyFavicon();
}

/* ============================================================
   PANELES
   ============================================================ */
function togglePanel(side){
  if(window.innerWidth >= 900){
    const layout = document.querySelector(".layout");
    const aside = document.getElementById(side === "left" ? "leftPanel" : "rightPanel");
    const layoutCls = side === "left" ? "left-compact" : "right-compact";
    if(aside.classList.contains("compact")){
      aside.classList.remove("compact");
      layout.classList.remove(layoutCls);
      if(side === "right" && UI.rightFilter){ UI.rightFilter = null; renderRight(); }
    } else {
      aside.classList.add("compact");
      layout.classList.add(layoutCls);
      if(side === "right" && UI.rightFilter){ UI.rightFilter = null; renderRight(); }
    }
    return;
  }
  const el = document.getElementById(side === "left" ? "leftPanel" : "rightPanel");
  const other = document.getElementById(side === "left" ? "rightPanel" : "leftPanel");
  const backdrop = document.getElementById("backdrop");
  if(el.classList.contains("open")){
    el.classList.remove("open"); el.classList.add("closed");
    backdrop.classList.remove("show"); UI.panelOpen = null;
  } else {
    el.classList.remove("closed"); el.classList.add("open");
    other.classList.remove("open"); other.classList.add("closed");
    backdrop.classList.add("show"); UI.panelOpen = side;
  }
}
function closePanels(){
  document.getElementById("leftPanel").className = "closed";
  document.getElementById("rightPanel").className = "closed";
  document.getElementById("backdrop").classList.remove("show");
  UI.panelOpen = null;
}

/* ============================================================
   INTERACCIÓN
   ============================================================ */
function openDetail(id){
  if(UI.pinnedDetails.includes(id)) return;
  UI.activeDetail = id;
  renderDetailStack();
  if(window.innerWidth < 900) closePanels();
  setTimeout(()=>{ document.getElementById("detailStack").scrollIntoView({behavior:"smooth", block:"nearest"}); }, 100);
}
function pinDetail(id){
  if(UI.pinnedDetails.includes(id)) UI.pinnedDetails = UI.pinnedDetails.filter(x => x !== id);
  else { UI.pinnedDetails.push(id); if(UI.activeDetail === id) UI.activeDetail = null; }
  renderDetailStack();
}
function closeDetail(id){
  if(UI.activeDetail === id) UI.activeDetail = null;
  renderDetailStack();
}
function clickSection(kind){
  const aside = document.getElementById("rightPanel");
  const layout = document.querySelector(".layout");
  if(window.innerWidth >= 900 && aside.classList.contains("compact")){
    aside.classList.remove("compact");
    layout.classList.remove("right-compact");
    UI.rightFilter = kind;
  } else {
    UI.rightFilter = (UI.rightFilter === kind) ? null : kind;
  }
  renderRight();
}
function clearFilter(){ UI.rightFilter = null; renderRight(); }

function toggleSlot(level, idx){
  const s = C.spellSlots[level];
  if(!s) return;
  s.used = (idx < s.used) ? idx : idx + 1;
  save(); renderSlots(); renderDetailStack();
}
function toggleUse(id, idx){
  const e = findEntry(id);
  if(!e || !e.uses) return;
  e.uses.current = (idx < e.uses.current) ? idx : idx + 1;
  save(); renderDetailStack(); renderQuickBar();
}
function useSlot(id, level){
  const pool = C.spellSlots[level];
  if(!pool) return;
  if(pool.used >= pool.max){ toast("Sin espacios disponibles"); return; }
  pool.used++;
  save(); renderSlots(); renderDetailStack();
  const e = findEntry(id);
  toast(`✦ ${e ? e.name : "Conjuro"} — espacios ${pool.max - pool.used}/${pool.max}`);
}
function useCharge(id){
  const e = findEntry(id);
  if(!e || !e.uses) return;
  if(e.uses.current <= 0){ toast("Sin usos disponibles"); return; }
  e.uses.current--;
  save(); renderDetailStack(); renderQuickBar();
  toast(`✦ ${e.name} — ${e.uses.current}/${e.uses.max}`);
}

/* ============================================================
   DESCANSOS
   ============================================================ */
function shortRest(){
  let restored = 0;
  for(const e of C.entries){
    if(e.uses && e.restore === "short" && e.uses.current < e.uses.max){ e.uses.current = e.uses.max; restored++; }
  }
  save(); renderAll();
  toast(restored ? `☕ Descanso corto — ${restored} recurso(s)` : "☕ Descanso corto");
}
function longRest(){
  const c = C.combat;
  c.hp.current = c.hp.max; c.hp.temp = 0;
  c.deathSaves = { s:0, f:0 };
  c.exhaustion = Math.max(0, c.exhaustion - 1);
  c.hitDice.current = Math.min(c.hitDice.max, c.hitDice.current + Math.ceil(c.hitDice.max/2));
  for(const lvl in C.spellSlots) C.spellSlots[lvl].used = 0;
  let restored = 0;
  for(const e of C.entries){
    if(e.uses && (e.restore === "long" || e.restore === "dawn") && e.uses.current < e.uses.max){ e.uses.current = e.uses.max; restored++; }
  }
  save(); renderAll();
  toast(`✨ Descanso largo — PG y espacios restaurados${restored?`, ${restored} recurso(s)`:""}`);
}

function renderCharList(){
  const el = document.getElementById("charList");
  // Agrupar por campaña
  const groups = {};
  for(const c of DB.characters){
    const key = c.campaign && c.campaign.trim() ? c.campaign.trim() : "(Sin campaña)";
    if(!groups[key]) groups[key] = [];
    groups[key].push(c);
  }
  // Ordenar: primera "Sin campaña"? No, mejor alfabético con "(Sin campaña)" al final
  const keys = Object.keys(groups).sort((a,b) => {
    if(a === "(Sin campaña)") return 1;
    if(b === "(Sin campaña)") return -1;
    return a.localeCompare(b);
  });

  let html = "";
  for(const key of keys){
    html += `<div class="char-group-label">🏰 ${esc(key)}</div>`;
    for(const c of groups[key]){
      const active = c.id === C.id;
      const hp = c.combat.hp;
      html += `<button class="char-item ${active?'active':''}" data-action="switch-to" data-id="${c.id}">
        <span class="ci-type ${c.type}">${c.type === "pc" ? "PJ" : "PNJ"}</span>
        <div class="ci-info">
          <div class="ci-name">${esc(c.meta.name)}</div>
          <div class="ci-sub">${esc(c.meta.class)} · Nv ${c.meta.level}</div>
        </div>
        <span class="ci-hp">${hp.current}/${hp.max}</span>
      </button>`;
    }
  }
  if(!html) html = `<div class="empty">Sin personajes.</div>`;
  el.innerHTML = html;
}

function switchTo(id){
  if(id === C.id){ closeChars(); return; }
  save();
  DB.activeId = id;
  C = activeChar();
  UI.activeDetail = null;
  UI.pinnedDetails = [];
  UI.rightFilter = null;
  save();
  renderAll();
  closeChars();
  toast(`▶ ${C.meta.name}`);
}

function newChar(type){
  save();
  const c = type === "npc" ? makeNPC() : makePC();
  if(type === "pc") c.meta.name = "Nuevo PJ";
  // Heredar campaña del actual
  c.campaign = C.campaign || "";
  DB.characters.push(c);
  DB.activeId = c.id;
  C = c;
  UI.activeDetail = null;
  UI.pinnedDetails = [];
  save();
  renderAll();
  closeChars();
  toast(`+ ${c.meta.name}`);
  setTimeout(()=>{ openSettings(); setTimeout(()=>document.getElementById("setCampaign").focus(), 200); }, 250);
}

function duplicateChar(){
  save();
  const copy = clone(C);
  copy.id = uid();
  copy.meta.name = (C.meta.name || "Personaje") + " (copia)";
  DB.characters.push(copy);
  DB.activeId = copy.id;
  C = copy;
  save(); renderAll(); closeChars();
  toast("Duplicado ✓");
}

function deleteChar(){
  if(DB.characters.length <= 1){ alert("Debe quedar al menos un personaje."); return; }
  if(!confirm(`¿Eliminar a "${C.meta.name}"?`)) return;
  const i = DB.characters.findIndex(c => c.id === C.id);
  DB.characters.splice(i,1);
  DB.activeId = DB.characters[0].id;
  C = DB.characters[0];
  UI.activeDetail = null;
  UI.pinnedDetails = [];
  save(); renderAll(); closeChars();
  toast("Eliminado");
}

/* ============================================================
   FORMULARIO DE ENTRADAS
   ============================================================ */
function openEntryForm(id){
  UI.editingId = id || null;
  const isNew = !id;
  document.getElementById("entryFormTitle").textContent = isNew ? "Nueva entrada" : "Editar entrada";
  document.getElementById("btnDeleteEntry").style.display = isNew ? "none" : "block";

  if(isNew){
    document.getElementById("fKind").value = "action";
    document.getElementById("fLevel").value = 0;
    document.getElementById("fName").value = "";
    document.getElementById("fTags").value = "";
    document.getElementById("fFormula").value = "";
    document.getElementById("fShort").value = "";
    document.getElementById("fDesc").value = "";
    document.getElementById("fUsesMax").value = 0;
    document.getElementById("fRestore").value = "";
  } else {
    const e = findEntry(id);
    if(!e) return;
    document.getElementById("fKind").value = e.kind;
    document.getElementById("fLevel").value = e.level || 0;
    document.getElementById("fName").value = e.name || "";
    document.getElementById("fTags").value = (e.tags||[]).join(", ");
    document.getElementById("fFormula").value = e.formula || "";
    document.getElementById("fShort").value = e.short || "";
    document.getElementById("fDesc").value = e.description || "";
    document.getElementById("fUsesMax").value = e.uses ? e.uses.max : 0;
    document.getElementById("fRestore").value = e.restore || "";
  }
  document.getElementById("entryModal").classList.add("open");
}
function closeEntryForm(){
  document.getElementById("entryModal").classList.remove("open");
  UI.editingId = null;
}
function saveEntryForm(){
  const name = document.getElementById("fName").value.trim();
  if(!name){ alert("El nombre es obligatorio"); return; }

  const kind = document.getElementById("fKind").value;
  const level = Math.max(0, Math.min(9, parseInt(document.getElementById("fLevel").value) || 0));
  const tags = document.getElementById("fTags").value.split(",").map(s => s.trim()).filter(Boolean);
  const formula = document.getElementById("fFormula").value.trim();
  const short = document.getElementById("fShort").value.trim();
  const description = document.getElementById("fDesc").value.trim();
  const usesMax = Math.max(0, parseInt(document.getElementById("fUsesMax").value) || 0);
  const restore = document.getElementById("fRestore").value;

  if(UI.editingId){
    const entry = findEntry(UI.editingId);
    if(!entry) return;
    const oldCurrent = entry.uses ? entry.uses.current : 0;
    const oldMax = entry.uses ? entry.uses.max : 0;
    entry.kind = kind; entry.name = name; entry.tags = tags;
    entry.formula = formula; entry.short = short; entry.description = description;
    entry.level = level;
    if(usesMax > 0){
      const newCurrent = (oldMax === usesMax) ? oldCurrent : usesMax;
      entry.uses = { current: newCurrent, max: usesMax };
      entry.restore = restore || "long";
    } else {
      delete entry.uses; delete entry.restore;
    }
    toast("Entrada actualizada ✓");
  } else {
    const entry = { id: uid(), kind, name, tags, formula, short, description, level };
    if(usesMax > 0){
      entry.uses = { current: usesMax, max: usesMax };
      entry.restore = restore || "long";
    }
    C.entries.push(entry);
    toast("Entrada creada ✓");
  }
  save(); renderAll(); closeEntryForm();
}
function deleteEntry(){
  if(!UI.editingId) return;
  const e = findEntry(UI.editingId);
  if(!e) return;
  if(!confirm(`¿Eliminar "${e.name}"?`)) return;
  C.entries = C.entries.filter(x => x.id !== UI.editingId);
  UI.pinnedDetails = UI.pinnedDetails.filter(x => x !== UI.editingId);
  if(UI.activeDetail === UI.editingId) UI.activeDetail = null;
  save(); renderAll(); closeEntryForm();
  toast("Eliminado");
}

/* ============================================================
   SETTINGS
   ============================================================ */
function openSettings(){
  document.getElementById("setCampaign").value = C.campaign || "";
  document.getElementById("setPortrait").value = C.portrait || "";
  document.getElementById("setWallpaper").value = C.wallpaper || "";
  document.getElementById("setIcon").value = C.icon || "";
  document.getElementById("jsonArea").value = JSON.stringify(C, null, 2);
  document.getElementById("settingsModal").classList.add("open");
}
function closeSettings(){ document.getElementById("settingsModal").classList.remove("open"); }
function applyJSON(){
  try{
    const parsed = JSON.parse(document.getElementById("jsonArea").value);
    const id = C.id, type = C.type, campaign = C.campaign;
    C = deepMerge(clone(type === "npc" ? NPC_TEMPLATE : DEFAULT_CHAR), parsed);
    C.id = id; C.type = type; C.campaign = parsed.campaign !== undefined ? parsed.campaign : campaign;
    save(); renderAll(); closeSettings();
    toast("Datos actualizados ✓");
  }catch(e){ alert("JSON inválido:\n" + e.message); }
}
function copyJSON(){
  const ta = document.getElementById("jsonArea"); ta.select();
  try{ document.execCommand("copy"); toast("Copiado ✓"); }
  catch(e){ navigator.clipboard?.writeText(ta.value).then(()=>toast("Copiado ✓")); }
}
function downloadJSON(){
  const blob = new Blob([JSON.stringify(C, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = (C.meta.name || "personaje").replace(/\s+/g,"_") + ".json";
  a.click(); URL.revokeObjectURL(url);
}
function resetChar(){
  if(!confirm("¿Restaurar este personaje al ejemplo? Se perderán los cambios.")) return;
  const id = C.id, type = C.type, campaign = C.campaign;
  C = type === "npc" ? clone(NPC_TEMPLATE) : clone(DEFAULT_CHAR);
  C.id = id; C.type = type; C.campaign = campaign;
  save(); renderAll(); closeSettings();
  toast("Restaurado");
}

/* ============================================================
   EVENTOS
   ============================================================ */
document.body.addEventListener("click", e => {
  const t = e.target.closest("[data-action]");
  if(!t) return;
  const a = t.dataset.action;
  switch(a){
    case "toggle-left": togglePanel("left"); break;
    case "toggle-right": togglePanel("right"); break;
    case "close-panels": closePanels(); break;
    case "open-detail": openDetail(t.dataset.id); break;
    case "pin-detail": pinDetail(t.dataset.id); break;
    case "close-detail": closeDetail(t.dataset.id); break;
    case "toggle-slot": toggleSlot(parseInt(t.dataset.level), parseInt(t.dataset.idx)); break;
    case "toggle-use": toggleUse(t.dataset.id, parseInt(t.dataset.idx)); break;
    case "use-slot": useSlot(t.dataset.id, parseInt(t.dataset.level)); break;
    case "use-charge": useCharge(t.dataset.id); break;
    case "click-section": clickSection(t.dataset.section); break;
    case "clear-filter": clearFilter(); break;

    case "short-rest": shortRest(); break;
    case "long-rest": longRest(); break;
    case "toggle-inspiration": C.combat.inspiration = !C.combat.inspiration; save(); renderRest(); break;
    case "hd-minus": if(C.combat.hitDice.current > 0){ C.combat.hitDice.current--; save(); renderRest(); } break;

    case "change-portrait": openSettings(); setTimeout(()=>document.getElementById("setPortrait").focus(), 200); break;
    case "open-settings": openSettings(); break;
    case "close-settings": closeSettings(); break;
    case "apply-json": applyJSON(); break;
    case "download-json": downloadJSON(); break;
    case "import-json": document.getElementById("fileImport").click(); break;
    case "copy-json": copyJSON(); break;
    case "reset-char": resetChar(); break;
    case "upload-portrait": document.getElementById("filePortrait").click(); break;
    case "upload-wallpaper": document.getElementById("fileWallpaper").click(); break;
    case "clear-portrait": C.portrait = ""; save(); applyPortrait(); document.getElementById("setPortrait").value = ""; break;
    case "clear-wallpaper": C.wallpaper = ""; save(); applyWallpaper(); document.getElementById("setWallpaper").value = ""; break;

    case "open-entry-form": openEntryForm(); break;
    case "edit-entry": openEntryForm(t.dataset.id); break;
    case "close-entry-form": closeEntryForm(); break;
    case "save-entry": saveEntryForm(); break;
    case "delete-entry": deleteEntry(); break;

    case "open-chars": openChars(); break;
    case "close-chars": closeChars(); break;
    case "switch-to": switchTo(t.dataset.id); break;
    case "new-pc": newChar("pc"); break;
    case "new-npc": newChar("npc"); break;
    case "duplicate-char": duplicateChar(); break;
    case "delete-char": deleteChar(); break;
  }
});

document.getElementById("backdrop").addEventListener("click", closePanels);

["hpCur","hpMax","hpTemp","acVal","iniVal","velVal"].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener("change", () => {
    const v = el.value === "" ? 0 : parseInt(el.value);
    if(isNaN(v)) return;
    switch(id){
      case "hpCur": C.combat.hp.current = Math.max(0, Math.min(C.combat.hp.max, v)); save(); renderVitals(); break;
      case "hpMax": C.combat.hp.max = Math.max(1, v); if(C.combat.hp.current > C.combat.hp.max) C.combat.hp.current = C.combat.hp.max; save(); renderVitals(); break;
      case "hpTemp": C.combat.hp.temp = Math.max(0, v); save(); renderVitals(); break;
      case "acVal": C.combat.ac = v; save(); break;
      case "iniVal": C.combat.initiativeMisc = v - mod(C.stats.dex); save(); break;
      case "velVal": C.combat.speed = v; save(); break;
    }
  });
  el.addEventListener("blur", () => { if(el.value === "") el.dispatchEvent(new Event("change")); });
});

document.getElementById("setCampaign").addEventListener("change", e => { C.campaign = e.target.value.trim(); save(); renderHeader(); });
document.getElementById("setPortrait").addEventListener("change", e => { C.portrait = e.target.value.trim(); save(); applyPortrait(); });
document.getElementById("setWallpaper").addEventListener("change", e => { C.wallpaper = e.target.value.trim(); save(); applyWallpaper(); });
document.getElementById("setIcon").addEventListener("change", e => { C.icon = e.target.value.trim(); save(); applyFavicon(); });
document.getElementById("filePortrait").addEventListener("change", e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ev => { C.portrait = ev.target.result; save(); applyPortrait(); toast("Retrato actualizado ✓"); };
  r.readAsDataURL(f); e.target.value = "";
});
document.getElementById("fileWallpaper").addEventListener("change", e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ev => { C.wallpaper = ev.target.result; save(); applyWallpaper(); toast("Fondo actualizado ✓"); };
  r.readAsDataURL(f); e.target.value = "";
});
document.getElementById("fileImport").addEventListener("change", e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ev => {
    try{
      const parsed = JSON.parse(ev.target.result);
      const id = C.id, type = C.type, campaign = C.campaign;
      C = deepMerge(clone(type === "npc" ? NPC_TEMPLATE : DEFAULT_CHAR), parsed);
      C.id = id; C.type = type; C.campaign = parsed.campaign || campaign;
      save(); renderAll(); closeSettings();
      toast("Importado ✓");
    }catch(err){ alert("JSON inválido:\n" + err.message); }
  };
  r.readAsText(f); e.target.value = "";
});

document.querySelectorAll(".modal").forEach(m => {
  m.addEventListener("click", e => { if(e.target === m) m.classList.remove("open"); });
});

/* ============================================================
   INIT
   ============================================================ */
if(!DB.characters.length){ const pc = makePC(); DB.characters = [pc]; DB.activeId = pc.id; }
if(!DB.characters.find(c => c.id === DB.activeId)) DB.activeId = DB.characters[0].id;
C = activeChar();
renderAll();
</script>
