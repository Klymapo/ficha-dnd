<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14141a">
<title>Ficha D&D</title>
<style>
:root{
  --bg:#14141a; --panel:#1e1e26; --panel2:#26262f; --border:#34343f;
  --text:#e8e8ec; --muted:#8a8a96; --accent:#c9a227;
  --hp:#e74c3c; --heal:#27ae60; --slot:#6a5acd;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);
  background:var(--bg);color:var(--text);font-size:16px;line-height:1.4;
  padding-bottom:80px;overscroll-behavior:none;transition:background .3s,color .3s;
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation}
input,textarea,select{font-family:inherit}

/* HEADER */
header{background:linear-gradient(180deg,var(--panel),var(--bg));border-bottom:1px solid var(--border);padding:10px 12px;position:sticky;top:0;z-index:10}
.char-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.char-info{flex:1;min-width:0}
.name{font-size:18px;font-weight:700;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.camp-tag{display:inline-block;font-size:10px;color:var(--muted);background:var(--panel2);padding:2px 8px;border-radius:10px;margin-top:3px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.header-btns{display:flex;gap:4px;flex-shrink:0}
.icon-btn{font-size:20px;padding:6px 9px;border-radius:8px;background:var(--panel2);border:1px solid var(--border);line-height:1}
.icon-btn:active{background:var(--accent);color:var(--bg)}
.vitals{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:6px;margin-bottom:8px}
.vital{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:6px 4px;text-align:center}
.vital .label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.vital .big{font-size:20px;font-weight:700}
#hpBox .big{color:var(--hp)}
#hpBox .temp{font-size:11px;color:#5dade2}
.tappable{text-decoration:underline dotted var(--muted);cursor:pointer}
.hp-controls{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.qbtn{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px 0;font-weight:600;font-size:14px;min-height:40px}
.qbtn:active{background:var(--accent);color:var(--bg)}
.qbtn.minus{color:#ff8b7a}
.qbtn.plus{color:#7fe0a0}

/* TABS */
nav.tabs{display:flex;overflow-x:auto;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:9;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;padding:12px 12px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);background:var(--bg)}

/* PANELS */
main{padding:12px;max-width:900px;margin:0 auto}
.panel{display:none}
.panel.active{display:block}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}
.card-title{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--accent);margin-bottom:10px;font-weight:700}
.row-card{display:flex;justify-content:space-between;align-items:center;gap:12px}
.row-card .card-title{margin:0}
.muted{color:var(--muted);font-size:13px}
.section-title{font-size:13px;text-transform:uppercase;letter-spacing:.7px;color:var(--accent);margin:14px 4px 8px;font-weight:700}
.empty{padding:24px;text-align:center;color:var(--muted);font-size:14px}

/* STATS */
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:8px;text-align:center;cursor:pointer}
.stat-card:active{background:var(--panel2)}
.stat-name{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.stat-val{font-size:22px;font-weight:700;margin:2px 0}
.stat-mod{font-size:15px;color:var(--accent);font-weight:700}
.stat-save{font-size:11px;color:var(--muted);margin-top:4px;padding-top:4px;border-top:1px dashed var(--border)}
.stat-save.prof{color:var(--text);font-weight:600}

/* SKILLS */
.skill-list{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.skill-row{display:grid;grid-template-columns:20px 1fr 40px 44px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--border);font-size:14px;gap:8px;cursor:pointer}
.skill-row:last-child{border-bottom:none}
.skill-row:active{background:var(--panel2)}
.skill-row.prof{background:rgba(39,174,96,.12)}
.skill-row.expertise{background:rgba(201,162,39,.14)}
.marker{color:var(--muted);font-size:12px;text-align:center}
.skill-row.prof .marker{color:#7fe0a0}
.skill-row.expertise .marker{color:var(--accent)}
.skill-stat{font-size:10px;color:var(--muted);text-align:right}
.skill-bonus{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.info-row{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}

/* COMBAT */
.death-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.death-col{text-align:center}
.death-label{font-size:11px;color:var(--muted);margin-bottom:6px;text-transform:uppercase}
.pips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.pip{width:26px;height:26px;border-radius:50%;border:2px solid var(--border);background:transparent}
.pip.on{background:var(--hp);border-color:var(--hp)}
.death-success.on{background:var(--heal);border-color:var(--heal)}
.pip.slot{border-radius:4px;border-color:var(--slot);width:28px;height:28px}
.pip.slot.used{background:var(--slot);border-color:var(--slot)}
.toggle{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-weight:600;min-height:40px}
.toggle.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.hd-row{display:flex;align-items:center;gap:10px}
.hd-val{font-weight:700;min-width:100px;text-align:center}
.cond-grid{display:flex;flex-wrap:wrap;gap:6px}
.cond{background:var(--panel2);border:1px solid var(--border);border-radius:20px;padding:6px 12px;font-size:12px;min-height:32px}
.cond.on{background:rgba(231,76,60,.3);border-color:var(--hp);color:#ffd0c8;font-weight:600}
.rest-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rest-btn{padding:12px;border-radius:10px;font-weight:700;min-height:48px}
.rest-btn.short{background:rgba(41,128,185,.25);border:1px solid rgba(41,128,185,.5)}
.rest-btn.long{background:rgba(142,68,173,.25);border:1px solid rgba(142,68,173,.5)}
.rest-btn:active{filter:brightness(1.3)}

/* ACCIONES */
.attack-card{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px}
.attack-card:active{background:var(--panel)}
.attack-name{font-weight:700;margin-bottom:4px}
.attack-stats{display:flex;gap:12px;font-size:14px;justify-content:space-between;flex-wrap:wrap}
.attack-bonus{color:var(--accent);font-weight:700}
.attack-dmg{color:#ff8b7a}
.attack-notes{font-size:12px;color:var(--muted);margin-top:4px}
.action-item{padding:10px 0;border-bottom:1px solid var(--border)}
.action-item:last-child{border-bottom:none}
.action-name{font-weight:700;color:var(--accent);margin-bottom:2px}
.action-desc{font-size:13px;color:var(--text);opacity:.85;line-height:1.45}

/* CONJUROS */
.slot-row{display:grid;grid-template-columns:70px 1fr 50px;align-items:center;gap:8px;padding:6px 0}
.slot-label{font-size:12px;color:var(--muted);font-weight:600}
.slot-count{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:13px}
.spell-item{padding:10px 0;border-bottom:1px solid var(--border)}
.spell-item:last-child{border-bottom:none}
.spell-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:3px;flex-wrap:wrap}
.spell-name{font-weight:700;color:var(--accent)}
.spell-tag{font-size:10px;background:var(--panel2);padding:2px 6px;border-radius:6px;color:var(--muted);text-transform:uppercase}
.spell-tag.prep{background:rgba(39,174,96,.25);color:var(--heal)}
.spell-desc{font-size:13px;opacity:.85;line-height:1.45}

/* INVENTARIO */
.inv-item{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-bottom:1px solid var(--border);align-items:start}
.inv-item:last-child{border-bottom:none}
.inv-name{font-weight:600}
.inv-notes{font-size:12px;color:var(--muted);margin-top:2px}
.inv-qty{background:var(--panel2);padding:2px 8px;border-radius:8px;font-weight:700;font-size:13px;min-width:32px;text-align:center}
.gold-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.gold-item{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px 4px;text-align:center}
.gold-label{font-size:10px;color:var(--muted);text-transform:uppercase}
.gold-val{font-size:16px;font-weight:700;color:var(--accent)}

/* NOTAS / LOG */
.notes-area{width:100%;min-height:60vh;background:var(--panel);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:12px;font-family:var(--font);font-size:15px;line-height:1.5;resize:vertical}
.log-list{display:flex;flex-direction:column;gap:6px}
.log-entry{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:9px 12px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.log-entry .log-time{color:var(--muted);font-size:11px;flex-shrink:0;min-width:44px;padding-top:2px}
.log-entry .log-icon{flex-shrink:0;font-size:14px}
.log-entry .log-text{flex:1;line-height:1.4}
.log-entry.dmg{border-left:3px solid var(--hp)}
.log-entry.heal{border-left:3px solid var(--heal)}
.log-entry.roll{border-left:3px solid var(--accent)}
.log-entry.info{border-left:3px solid var(--slot)}

/* BESTIARIO */
.beast-item{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}
.beast-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.beast-name{font-weight:700;color:var(--accent);font-size:15px}
.beast-ac{font-size:12px;color:var(--muted);background:var(--panel2);padding:3px 8px;border-radius:6px}
.hp-bar{background:var(--panel2);height:26px;border-radius:8px;overflow:hidden;position:relative;margin-bottom:8px;border:1px solid var(--border)}
.hp-fill{position:absolute;inset:0;width:100%;background:linear-gradient(90deg,var(--hp),#c0392b);transition:width .2s}
.hp-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;text-shadow:0 1px 2px rgba(0,0,0,.8);color:#fff}
.beast-controls{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.beast-conds{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.beast-cond{font-size:10px;background:rgba(231,76,60,.3);border:1px solid var(--hp);padding:2px 6px;border-radius:10px;color:#ffd0c8}

/* MODAL */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.modal.open{display:flex}
.modal-content{background:var(--panel);width:100%;max-width:700px;max-height:92vh;border-radius:16px 16px 0 0;padding:16px;overflow-y:auto;color:var(--text)}
@media(min-width:640px){
  .modal{align-items:center}
  .modal-content{border-radius:16px;max-height:85vh}
}
.modal-title{font-size:16px;font-weight:700;color:var(--accent);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.edit-area{width:100%;min-height:40vh;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.4}
.modal-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.btn{padding:12px;border-radius:10px;font-weight:700;background:var(--panel2);border:1px solid var(--border);min-height:46px;color:var(--text)}
.btn:active{filter:brightness(1.3)}
.btn.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.btn.danger{background:rgba(231,76,60,.2);color:#ff9a8a;border-color:var(--hp)}
.field{margin-bottom:10px}
.field label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;margin-bottom:4px;letter-spacing:.5px}
.field input,.field select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--text);font-size:15px}

/* CHAR LIST */
.char-list,.camp-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;max-height:50vh;overflow-y:auto}
.char-list-item,.camp-list-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;cursor:pointer;text-align:left}
.char-list-item.active,.camp-list-item.active{border-color:var(--accent);background:rgba(201,162,39,.1)}
.char-list-item:active,.camp-list-item:active{filter:brightness(1.2)}
.char-list-item .ci-name{font-weight:700;flex:1}
.char-list-item .ci-sub{font-size:11px;color:var(--muted)}
.char-list-item .ci-type{font-size:10px;padding:2px 6px;border-radius:6px;background:var(--panel);color:var(--muted);text-transform:uppercase}
.char-list-item .ci-type.pc{background:rgba(39,174,96,.25);color:var(--heal)}
.char-list-item .ci-type.npc{background:rgba(231,76,60,.25);color:#ff9a8a}
.camp-color{width:16px;height:16px;border-radius:50%;flex-shrink:0}
.camp-list-item .ci-name{font-weight:700;flex:1}
.camp-list-item .ci-sub{font-size:11px;color:var(--muted)}

/* THEME PICKER */
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-bottom:12px}
.theme-swatch{padding:10px;border-radius:10px;border:2px solid var(--border);cursor:pointer;text-align:center;font-size:11px;font-weight:600}
.theme-swatch.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(201,162,39,.3)}
.theme-swatch .swatch-colors{display:flex;height:20px;border-radius:6px;overflow:hidden;margin-bottom:6px}
.theme-swatch .swatch-colors div{flex:1}

/* DICE */
.dice-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.die-btn{padding:14px 8px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;font-weight:700;font-size:15px;min-height:52px;color:var(--text)}
.die-btn:active{background:var(--accent);color:var(--bg)}
.mod-row{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.mod-row label{font-size:13px;color:var(--muted);flex-shrink:0}
.mod-row input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--text);font-size:15px;min-width:0}
.mode-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:12px}
.mode-btn{padding:10px;border-radius:8px;background:var(--panel2);border:1px solid var(--border);font-size:12px;font-weight:600;color:var(--text)}
.mode-btn.active{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.dice-result{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:16px;text-align:center;margin-bottom:12px;min-height:80px;display:flex;flex-direction:column;justify-content:center}
.dice-result .dr-total{font-size:36px;font-weight:800;color:var(--accent);line-height:1}
.dice-result .dr-detail{font-size:12px;color:var(--muted);margin-top:6px}
.dice-result .dr-formula{font-size:11px;color:var(--muted);margin-top:4px;opacity:.7}
.dice-history{font-size:12px;color:var(--muted);margin-top:8px;max-height:120px;overflow-y:auto}
.dice-history div{padding:3px 0;border-bottom:1px dashed var(--border)}

/* FAB */
.fab{position:fixed;right:16px;bottom:20px;width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--bg);font-size:26px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.5);z-index:50;display:flex;align-items:center;justify-content:center;border:none}
.fab:active{transform:scale(.94)}

/* TOAST */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--bg);padding:10px 18px;border-radius:24px;font-weight:700;font-size:14px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
</style>
</head>
<body>

<header>
  <div class="char-head">
    <div class="char-info">
      <div id="charName" class="name">—</div>
      <div id="charSub" class="sub">—</div>
      <div id="campTag" class="camp-tag">—</div>
    </div>
    <div class="header-btns">
      <button class="icon-btn" data-action="open-campaigns" title="Campañas">🏰</button>
      <button class="icon-btn" data-action="open-chars" title="Personajes">👥</button>
      <button class="icon-btn" data-action="open-dice" title="Dados">🎲</button>
      <button class="icon-btn" data-action="open-edit" title="Editar">⚙</button>
    </div>
  </div>
  <div class="vitals">
    <div class="vital" id="hpBox">
      <div class="label">PG</div>
      <div class="big"><span id="hpCur">0</span>/<span id="hpMax" class="tappable" data-action="edit-max-hp">0</span></div>
      <div class="temp" id="tempDisplay"></div>
    </div>
    <div class="vital"><div class="label">CA</div><div class="big" id="acDisplay">—</div></div>
    <div class="vital"><div class="label">Inic</div><div class="big" id="initDisplay">—</div></div>
    <div class="vital"><div class="label">Vel</div><div class="big" id="speedDisplay">—</div></div>
  </div>
  <div class="hp-controls">
    <button class="qbtn minus" data-action="hp" data-delta="-10">−10</button>
    <button class="qbtn minus" data-action="hp" data-delta="-5">−5</button>
    <button class="qbtn minus" data-action="hp" data-delta="-1">−1</button>
    <button class="qbtn plus"  data-action="hp" data-delta="1">+1</button>
    <button class="qbtn plus"  data-action="hp" data-delta="5">+5</button>
    <button class="qbtn plus"  data-action="hp" data-delta="10">+10</button>
  </div>
</header>

<nav class="tabs" id="tabsNav"></nav>

<main>
  <section class="panel" id="panel-combate"></section>
  <section class="panel" id="panel-stats"></section>
  <section class="panel" id="panel-acciones"></section>
  <section class="panel" id="panel-conjuros"></section>
  <section class="panel" id="panel-inv"></section>
  <section class="panel" id="panel-notas"></section>
  <section class="panel" id="panel-log"></section>
  <section class="panel" id="panel-bestia"></section>
</main>

<button class="fab" data-action="open-dice" title="Tirar dados">🎲</button>

<!-- MODAL: EDITAR PERSONAJE -->
<div class="modal" id="editModal">
  <div class="modal-content">
    <div class="modal-title">Editar personaje <button class="icon-btn" data-action="close-edit">✕</button></div>
    <div class="section-title" style="margin-top:0">Tema visual</div>
    <div class="theme-grid" id="themeGrid"></div>
    <div class="section-title">Tipografía</div>
    <select id="fontSelect" style="width:100%;padding:10px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;margin-bottom:14px;font-size:15px"></select>
    <div class="section-title">Datos (JSON)</div>
    <p class="muted" style="font-size:12px;margin:0 0 8px">Edita y pulsa <b>Aplicar</b>. Úsalo también para respaldar.</p>
    <textarea id="editArea" class="edit-area" spellcheck="false"></textarea>
    <div class="modal-btns">
      <button class="btn primary" data-action="apply-json">Aplicar</button>
      <button class="btn" data-action="download-json">Descargar</button>
      <button class="btn" data-action="copy-json">Copiar JSON</button>
      <button class="btn" data-action="import-json">Importar JSON</button>
      <button class="btn danger" style="grid-column:1/-1" data-action="reset-char">Restaurar ejemplo de este personaje</button>
    </div>
    <input type="file" id="importFile" accept=".json,application/json" style="display:none">
  </div>
</div>

<!-- MODAL: PERSONAJES -->
<div class="modal" id="charModal">
  <div class="modal-content">

/* ============================================================

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function deepMerge(t,s){
  for(const k in s){
    if(s[k] && typeof s[k]==="object" && !Array.isArray(s[k])) t[k] = deepMerge(t[k]||{}, s[k]);
    else t[k] = s[k];
  }
  return t;
}
const mod = n => Math.floor((n-10)/2);
const fmt = n => (n>=0?"+":"")+n;
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtTime = ts => { const d=new Date(ts); return d.getHours().toString().padStart(2,"0")+":"+d.getMinutes().toString().padStart(2,"0"); };
const nowStr = () => new Date().toLocaleTimeString("es", {hour:"2-digit", minute:"2-digit"});

   ============================================================ */

let C = DB.characters.find(c => c.id === DB.activeId) || DB.characters[0];

function makeCampaign(name){
  return { id: uid(), name: name || "Nueva campaña", theme: "dark", font: "system" };
}
function makePC(){
  const c = clone(DEFAULT_CHAR);
  c.id = uid(); c.type = "pc"; c.theme = "inherit"; c.font = "inherit";
  c.campaignId = DB.activeCampaignId;
  return c;
}
function makeNPC(){
  const c = clone(NPC_TEMPLATE);
  c.id = uid(); c.type = "npc"; c.theme = "inherit"; c.font = "inherit";
  c.campaignId = DB.activeCampaignId;
  return c;
}
function loadDB(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const db = JSON.parse(raw);
      if(db && Array.isArray(db.characters) && db.characters.length){
        // Migrar estructura de campañas si falta
        if(!Array.isArray(db.campaigns) || !db.campaigns.length){
          const camp = makeCampaign("Mi campaña");
          db.campaigns = [camp];
          db.activeCampaignId = camp.id;
          db.characters.forEach(c => { if(!c.campaignId) c.campaignId = camp.id; });
        }
        if(!db.activeCampaignId || !db.campaigns.find(x => x.id === db.activeCampaignId)){
          db.activeCampaignId = db.campaigns[0].id;
        }
        db.characters.forEach(c => {
          if(!c.campaignId) c.campaignId = db.campaigns[0].id;
          if(!c.theme) c.theme = "inherit";
          if(!c.font) c.font = "inherit";
        });
        return db;
      }
    }
    // Migración desde v1
    const old = localStorage.getItem(OLD_KEY_V1);
    if(old){
      const camp = makeCampaign("Mi campaña");
      const c = deepMerge(clone(DEFAULT_CHAR), JSON.parse(old));
      c.id = uid(); c.type = "pc"; c.theme = "inherit"; c.font = "inherit";
      c.campaignId = camp.id;
      return { campaigns:[camp], activeCampaignId:camp.id, characters:[c], activeId:c.id, log:[] };
    }
  }catch(e){ console.warn(e); }
  // Fresh install
  const camp = makeCampaign("Mi campaña");
  const c = clone(DEFAULT_CHAR);
  c.id = uid(); c.type = "pc"; c.theme = "inherit"; c.font = "inherit";
  c.campaignId = camp.id;
  return { campaigns:[camp], activeCampaignId:camp.id, characters:[c], activeId:c.id, log:[] };
}
function save(){
  try{
    const i = DB.characters.findIndex(c => c.id === C.id);
    if(i>=0) DB.characters[i] = C;
    if(DB.log && DB.log.length > 200) DB.log = DB.log.slice(-200);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
  }catch(e){ console.warn("No se pudo guardar", e); }
}
function activeChar(){ return DB.characters.find(c => c.id === DB.activeId) || DB.characters[0]; }
function activeCampaign(){ return DB.campaigns.find(x => x.id === DB.activeCampaignId) || DB.campaigns[0]; }
function campaignChars(cid){ return DB.characters.filter(c => c.campaignId === (cid || DB.activeCampaignId)); }

function addLog(text, type="info", icon=""){
  const icons = { dmg:"🩸", heal:"💚", roll:"🎲", info:"📜" };
  DB.log = DB.log || [];
  DB.log.push({ ts:Date.now(), text, type, icon: icon || icons[type] || "•" });
  if(DB.log.length > 200) DB.log = DB.log.slice(-200);
  save();
  if(document.getElementById("panel-log")?.classList.contains("active")) renderLog();
}

/* ============================================================
   DADOS
   ============================================================ */
function rollFormula(formula){
  formula = String(formula).replace(/\s/g,"").toLowerCase();
  const terms = formula.match(/[+-]?\d*d\d+|[+-]?\d+/g) || [];
  let total = 0;
  const parts = [];
  for(const t of terms){
    const sign = t.startsWith("-") ? -1 : 1;
    const clean = t.replace(/^[+-]/,"");
    if(clean.includes("d")){
      const [nStr, sStr] = clean.split("d");
      const n = parseInt(nStr)||1, s = parseInt(sStr)||20;
      const dice = [];
      for(let i=0;i<n;i++) dice.push(1 + Math.floor(Math.random()*s));
      const sum = dice.reduce((a,b)=>a+b,0);
      total += sum * sign;
      parts.push(`${sign<0?"−":"+"}${n}d${s}[${dice.join(",")}]`);
    } else {
      const v = parseInt(clean)||0;
      total += v * sign;
      parts.push(`${sign<0?"−":"+"}${v}`);
    }
  }
  return { total, parts: parts.join(" ").replace(/^\+/,""), formula };
}
function rollD20(mode="normal"){
  const a = 1 + Math.floor(Math.random()*20);
  if(mode === "normal") return { rolls:[a], chosen:a, detail:"" };
  const b = 1 + Math.floor(Math.random()*20);
  const chosen = mode === "adv" ? Math.max(a,b) : Math.min(a,b);
  return { rolls:[a,b], chosen, detail:`(${a}, ${b})` };
}
function showDiceResult(formula, total, detail){
  const r = document.getElementById("diceResult");
  r.innerHTML = `<div class="dr-total">${total}</div>
    <div class="dr-detail">${esc(detail)}</div>
    <div class="dr-formula">${esc(formula)}</div>`;
  const hist = document.getElementById("diceHistory");
  const entry = document.createElement("div");
  entry.textContent = `${nowStr()} · ${formula} = ${total} ${detail}`;
  hist.prepend(entry);
  while(hist.children.length > 8) hist.lastChild.remove();
}
function rollAndLog(formula, label){
  const r = rollFormula(formula);
  const text = label ? `${label}: ${r.formula} = ${r.total} (${r.parts})` : `${r.formula} = ${r.total}`;
  addLog(text, "roll");
  showDiceResult(formula, r.total, r.parts);
  toast(`🎲 ${r.total}`);
  return r;
}

/* ============================================================
   TEMA
   ============================================================ */
function resolveTheme(char){
  if(!char.theme || char.theme === "inherit"){
    const camp = DB.campaigns.find(x => x.id === char.campaignId);
    return camp?.theme || "dark";
  }
  return char.theme;
}
function resolveFont(char){
  if(!char.font || char.font === "inherit"){
    const camp = DB.campaigns.find(x => x.id === char.campaignId);
    return camp?.font || "system";
  }
  return char.font;
}
function applyTheme(char){
  const t = THEMES[resolveTheme(char)] || THEMES.dark;
  const f = FONTS[resolveFont(char)] || FONTS.system;
  const r = document.documentElement.style;
  r.setProperty("--bg", t.bg);
  r.setProperty("--panel", t.panel);
  r.setProperty("--panel2", t.panel2);
  r.setProperty("--border", t.border);
  r.setProperty("--text", t.text);
  r.setProperty("--muted", t.muted);
  r.setProperty("--accent", t.accent);
  r.setProperty("--font", f.value);
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute("content", t.bg);
}

  }
}
function switchTab(name){
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === name));
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.id === "panel-" + name));
  if(name === "log") renderLog();
  if(name === "bestia") renderBestia();
  if(name === "notas") renderNotas();
}

function renderStats(){
  const el = document.getElementById("panel-stats");
  const s = C.stats;
  let html = '<div class="grid-3">';
  for(const k of ["str","dex","con","int","wis","cha"]){
    const m = mod(s[k]);
    const isSave = C.saveProfs.includes(k);
    const saveBonus = m + (isSave ? C.profBonus : 0);
    html += `<div class="stat-card" data-action="roll" data-formula="1d20${fmt(saveBonus)}" data-label="Salv. ${STAT_NAMES[k]}">
      <div class="stat-name">${STAT_NAMES[k]}</div>
      <div class="stat-val">${s[k]}</div>
      <div class="stat-mod">${fmt(m)}</div>
      <div class="stat-save ${isSave?'prof':''}">Salv. ${fmt(saveBonus)}</div>
    </div>`;
  }
  html += '</div>';

  html += '<div class="section-title">Habilidades</div><div class="skill-list">';
  for(const key in SKILLS){
    const sk = SKILLS[key];
    const base = mod(s[sk.stat]);
    const isP = C.skillProfs.includes(key);
    const isE = C.skillExpertise.includes(key);
    const b = base + (isP?C.profBonus:0) + (isE?C.profBonus:0);
    const marker = isE?"◆":(isP?"●":"○");
    const cls = isE?"expertise":(isP?"prof":"");
    html += `<div class="skill-row ${cls}" data-action="roll" data-formula="1d20${fmt(b)}" data-label="${sk.name}">
      <span class="marker">${marker}</span>
      <span class="skill-name">${sk.name}</span>
      <span class="skill-stat">${sk.stat.toUpperCase()}</span>
      <span class="skill-bonus">${fmt(b)}</span>
    </div>`;
  }
  html += '</div>';
  const perc = 10 + mod(s.wis) + (C.skillProfs.includes("perception")?C.profBonus:0) + (C.skillExpertise.includes("perception")?C.profBonus:0);
  html += `<div class="info-row">Bono de competencia: <b>+${C.profBonus}</b> · Percepción pasiva: <b>${perc}</b></div>`;
  el.innerHTML = html;
}

function renderConjuros(){
  const el = document.getElementById("panel-conjuros");
  let html = "";

  if(C.cantrips.length){
    html += `<div class="card"><div class="card-title">Trucos</div>`;
    html += C.cantrips.map(s=>`<div class="spell-item"><div class="spell-head"><span class="spell-name">${esc(s.name)}</span><span class="spell-tag">Truco</span></div><div class="spell-desc">${esc(s.desc)}</div></div>`).join("");
    html += `</div>`;
  }

  html += `<div class="card"><div class="card-title">Espacios de conjuro</div>`;
  let hasSlots = false;
  for(let lvl=1; lvl<=9; lvl++){
    const s = C.spells.slots[lvl];

    hasSlots = true;
    html += `<div class="slot-row">
      <div class="slot-label">Nivel ${lvl}</div>

  if(!hasSlots) html += `<div class="muted">Sin espacios configurados.</div>`;
  html += `</div>`;

  const byLevel = {};
  (C.spells.list||[]).forEach(s => { (byLevel[s.level] = byLevel[s.level] || []).push(s); });

/* ============================================================
   ACCIONES DE COMBATE
   ============================================================ */
function applyHP(delta, opts={}){
  const c = C.combat;
  const before = c.hp.current;
  let temp = c.hp.temp;
  if(delta < 0){
    let dmg = -delta;
    if(temp > 0){
      const abs = Math.min(temp, dmg);
      temp -= abs; dmg -= abs;
    }
    c.hp.current = Math.max(0, c.hp.current - dmg);
  } else {
    c.hp.current = Math.min(c.hp.max, c.hp.current + delta);
  }
  c.hp.temp = temp;
  save(); renderHeader(); renderCombat();
  if(!opts.silent){
    if(delta < 0) addLog(`${C.meta.name}: ${before} → ${c.hp.current} PG (${delta})`, "dmg");
    else addLog(`${C.meta.name}: ${before} → ${c.hp.current} PG (+${delta})`, "heal");
  }
}
function toggleDeath(type, idx){
  const d = C.combat.deathSaves;
  if(type === "s") d.s = (idx < d.s) ? idx : idx + 1;
  else d.f = (idx < d.f) ? idx : idx + 1;
  save(); renderCombat();
}
function toggleCondition(name){
  const arr = C.combat.conditions;
  const i = arr.indexOf(name);
  if(i >= 0){ arr.splice(i,1); addLog(`${C.meta.name} ya no está ${name}`, "info"); }
  else { arr.push(name); addLog(`${C.meta.name} está ${name}`, "info"); }
  save(); renderCombat();
}
function toggleSlot(level, idx){
  const s = C.spells.slots[level];
  if(!s) return;
  s.used = (idx < s.used) ? idx : idx + 1;
  save(); renderConjuros();
}
function changeHD(d){
  const hd = C.combat.hitDice;
  hd.current = Math.max(0, Math.min(hd.max, hd.current + d));
  save(); renderCombat();
}
function spendHD(){
  const hd = C.combat.hitDice;
  if(hd.current <= 0){ toast("Sin dados de golpe"); return; }
  const sides = parseInt(hd.die.replace("d","")) || 8;
  const roll = Math.floor(Math.random() * sides) + 1;
  const conM = mod(C.stats.con);
  const heal = Math.max(1, roll + conM);
  hd.current--;
  C.combat.hp.current = Math.min(C.combat.hp.max, C.combat.hp.current + heal);
  save(); renderAll();
  addLog(`Dado de golpe: ${roll} ${fmt(conM)} = ${heal} PG curados`, "heal");
  toast(`💚 +${heal} PG`);
}
function changeExh(d){
  C.combat.exhaustion = Math.max(0, Math.min(6, C.combat.exhaustion + d));
  save(); renderCombat();
}
function shortRest(){
  addLog(`${C.meta.name}: descanso corto`, "info");
  toast("Descanso corto ☕");
}
function longRest(){
  const c = C.combat;
  c.hp.current = c.hp.max;
  c.hp.temp = 0;
  c.deathSaves = { s:0, f:0 };
  c.exhaustion = Math.max(0, c.exhaustion - 1);
  c.hitDice.current = Math.min(c.hitDice.max, c.hitDice.current + Math.ceil(c.hitDice.max/2));
  for(const lvl in C.spells.slots) C.spells.slots[lvl].used = 0;
  save(); renderAll();
  addLog(`${C.meta.name}: descanso largo — PG y espacios restaurados`, "heal");
  toast("✨ Descanso largo completo");
}

function switchCampaign(id){
  if(id === DB.activeCampaignId){ closeCamps(); return; }
  save();
  DB.activeCampaignId = id;
  // Buscar personaje activo dentro de la nueva campaña
  const chars = campaignChars(id);
  if(!chars.find(c => c.id === DB.activeId)){
    if(chars.length) DB.activeId = chars[0].id;
    else {
      // No hay personajes: crear uno automáticamente
      const pc = makePC();
      DB.characters.push(pc);
      DB.activeId = pc.id;
    }
  }
  C = activeChar();
  save();
  renderAll();
  closeCamps();
  toast(`🏰 ${activeCampaign().name}`);
}

function saveCampaign(){
  const camp = activeCampaign();
  if(!camp) return;
  const name = document.getElementById("campNameInput").value.trim();
  if(!name){ alert("La campaña necesita un nombre."); return; }
  camp.name = name;
  camp.theme = document.getElementById("campThemeSelect").value;
  camp.font = document.getElementById("campFontSelect").value;
  save();
  renderAll();
  renderCampList();
  toast("Campaña guardada ✓");
}

function newCampaign(){
  save();
  const camp = makeCampaign("Nueva campaña " + (DB.campaigns.length + 1));
  DB.campaigns.push(camp);
  DB.activeCampaignId = camp.id;
  const pc = makePC();
  DB.characters.push(pc);
  DB.activeId = pc.id;
  C = pc;
  save();
  renderAll();
  renderCampList();
  renderCampEditor();
  toast(`🏰 ${camp.name}`);
}

function deleteCampaign(){
  if(DB.campaigns.length <= 1){
    alert("Debe quedar al menos una campaña.");
    return;
  }
  const camp = activeCampaign();
  const count = DB.characters.filter(c => c.campaignId === camp.id).length;
  if(!confirm(`¿Eliminar la campaña "${camp.name}"? Se borrarán también sus ${count} personaje(s).`)) return;
  // Eliminar personajes de la campaña
  DB.characters = DB.characters.filter(c => c.campaignId !== camp.id);
  DB.campaigns = DB.campaigns.filter(c => c.id !== camp.id);
  DB.activeCampaignId = DB.campaigns[0].id;
  const chars = campaignChars();
  if(chars.length) DB.activeId = chars[0].id;
  C = activeChar();
  save(); renderAll(); renderCampList(); renderCampEditor();
  toast("Campaña eliminada");
}

function resetChar(){
  if(!confirm("¿Restaurar este personaje al ejemplo? Se perderán los cambios.")) return;
  const id = C.id, type = C.type, theme = C.theme, font = C.font, campaignId = C.campaignId;
  C = type === "npc" ? clone(NPC_TEMPLATE) : clone(DEFAULT_CHAR);
  C.id = id; C.type = type; C.theme = theme; C.font = font; C.campaignId = campaignId;
  const i = DB.characters.findIndex(c => c.id === id);
  if(i >= 0) DB.characters[i] = C;
  save(); renderAll(); closeEdit();
  toast("Restaurado");
}

function clearLog(){
  if(!confirm("¿Borrar toda la bitácora?")) return;
  DB.log = [];
  save(); renderLog();
  toast("Bitácora limpia");
}

/* ============================================================
   EVENTOS
   ============================================================ */
document.body.addEventListener("click", e => {
  const t = e.target.closest("[data-action]");
  if(!t) return;
  const a = t.dataset.action;
  switch(a){
    case "tab": switchTab(t.dataset.tab); break;
    case "hp": applyHP(parseInt(t.dataset.delta)); break;
    case "edit-max-hp": {
      const v = prompt("PG máximos:", C.combat.hp.max);
      if(v !== null){
        const n = parseInt(v);
        if(!isNaN(n) && n > 0){
          C.combat.hp.max = n;
          if(C.combat.hp.current > n) C.combat.hp.current = n;
          save(); renderHeader();
        }
      }
      break;
    }
    case "death": toggleDeath(t.dataset.type, parseInt(t.dataset.idx)); break;
    case "inspiration": C.combat.inspiration = !C.combat.inspiration; save(); renderCombat(); break;
    case "hd": changeHD(parseInt(t.dataset.delta)); break;
    case "spend-hd": spendHD(); break;
    case "exh": changeExh(parseInt(t.dataset.delta)); break;
    case "cond": toggleCondition(t.dataset.cond); break;
    case "short-rest": shortRest(); break;
    case "long-rest": longRest(); break;
    case "slot": toggleSlot(parseInt(t.dataset.level), parseInt(t.dataset.idx)); break;
    case "roll": rollAndLog(t.dataset.formula, t.dataset.label || ""); break;

    case "open-edit": openEdit(); break;
    case "close-edit": closeEdit(); break;
    case "apply-json": applyJSON(); break;
    case "copy-json": copyJSON(); break;
    case "download-json": downloadJSON(); break;
    case "import-json": importJSON(); break;
    case "reset-char": resetChar(); break;
    case "set-theme": C.theme = t.dataset.theme; save(); applyTheme(C); renderThemePicker(); break;

    case "open-chars": openChars(); break;
    case "close-chars": closeChars(); break;
    case "new-pc": newChar("pc"); break;
    case "new-npc": newChar("npc"); break;
    case "duplicate-char": duplicateChar(); break;
    case "delete-char": deleteChar(); break;
    case "switch-to": switchTo(t.dataset.id); break;

    case "open-campaigns": openCamps(); break;
    case "close-campaigns": closeCamps(); break;
    case "switch-camp": switchCampaign(t.dataset.id); break;
    case "save-campaign": saveCampaign(); break;
    case "new-campaign": newCampaign(); break;
    case "delete-campaign": deleteCampaign(); break;

    case "open-dice": document.getElementById("diceModal").classList.add("open"); break;
    case "close-dice": document.getElementById("diceModal").classList.remove("open"); break;
    case "dice-mode":
      document.querySelectorAll(".mode-btn").forEach(b => b.classList.toggle("active", b === t));
      break;
    case "roll-die": {
      const die = parseInt(t.dataset.die);
      const adv = t.dataset.adv === "1";
      const modVal = parseInt(document.getElementById("diceMod").value) || 0;
      const modeBtn = document.querySelector(".mode-btn.active");
      const mode = adv ? "adv" : (modeBtn ? modeBtn.dataset.mode : "normal");
      let total, detail, formula;
      if(die === 20){
        const r = rollD20(mode);
        total = r.chosen + modVal;
        detail = r.detail ? `${r.detail} ${modVal>=0?'+':''}${modVal}` : `${r.chosen}${modVal?` ${modVal>=0?'+':''}${modVal}`:""}`;
        formula = `1d20${mode==="adv"?" (ventaja)":mode==="dis"?" (desventaja)":""}${fmt(modVal)}`;
      } else {
        const r = rollFormula(`1d${die}${fmt(modVal)}`);
        total = r.total;
        detail = r.parts;
        formula = `1d${die}${fmt(modVal)}`;
      }
      showDiceResult(formula, total, detail);
      addLog(`${formula} = ${total}`, "roll");
      toast(`🎲 ${total}`);
      break;
    }

    case "clear-log": clearLog(); break;

    case "npc-hp": {
      const id = t.dataset.id;
      const delta = parseInt(t.dataset.delta);
      const n = DB.characters.find(c => c.id === id);
      if(!n) return;
      const before = n.combat.hp.current;
      n.combat.hp.current = Math.max(0, Math.min(n.combat.hp.max, n.combat.hp.current + delta));
      save(); renderBestia();
      addLog(`${n.meta.name}: ${before} → ${n.combat.hp.current} PG (${delta>=0?'+':''}${delta})`, delta < 0 ? "dmg" : "heal");
      break;
    }
    case "npc-roll-init": {
      const n = DB.characters.find(c => c.id === t.dataset.id);
      if(!n) return;
      const r = rollFormula(`1d20${fmt(mod(n.stats.dex)+(n.combat.initiativeMisc||0))}`);
      toast(`Ini ${n.meta.name}: ${r.total}`);
      addLog(`Iniciativa ${n.meta.name}: ${r.total}`, "roll");
      break;
    }
  }
});

document.body.addEventListener("input", e => {
  if(e.target.id === "notesArea"){ C.notes = e.target.value; save(); }
});

document.querySelectorAll(".modal").forEach(m => {
  m.addEventListener("click", e => { if(e.target === m) m.classList.remove("open"); });
});

document.getElementById("fontSelect").addEventListener("change", e => {
  C.font = e.target.value;
  save(); applyTheme(C); renderFontSelect();
});

document.getElementById("importFile").addEventListener("change", e => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try{
      const parsed = JSON.parse(ev.target.result);
      if(parsed.meta && parsed.combat){
        const c = deepMerge(clone(parsed.type === "npc" ? NPC_TEMPLATE : DEFAULT_CHAR), parsed);
        c.id = uid();
        c.type = c.type || "pc";
        c.theme = c.theme || "inherit";
        c.font = c.font || "inherit";
        c.campaignId = DB.activeCampaignId;
        DB.characters.push(c);
        DB.activeId = c.id;
        C = c;
        save(); renderAll(); closeEdit();
        toast(`Importado: ${c.meta.name}`);
      } else if(parsed.characters){
        if(confirm("El archivo es una copia completa. ¿Reemplazar TODOS los datos actuales?")){
          DB = parsed;
          if(!DB.campaigns || !DB.campaigns.length){
            const camp = makeCampaign("Mi campaña");
            DB.campaigns = [camp]; DB.activeCampaignId = camp.id;
            DB.characters.forEach(c => c.campaignId = camp.id);
          }
          C = activeChar();
          save(); renderAll(); closeEdit();
          toast("Respaldo restaurado ✓");
        }
      }
    }catch(err){
      alert("Archivo JSON inválido:\n" + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = "";
});

document.addEventListener("keydown", e => {
  if(e.target.matches("input,textarea")) return;
  if(e.key === "Escape"){
    document.querySelectorAll(".modal.open").forEach(m => m.classList.remove("open"));
  }
  if(e.key === "d" && !e.metaKey && !e.ctrlKey){
    document.getElementById("diceModal").classList.toggle("open");
  }
});

/* ============================================================
   INIT
   ============================================================ */
(function init(){
  if(!DB.characters.length){
    const pc = makePC();
    DB.characters = [pc];
    DB.activeId = pc.id;
  }
  if(!DB.characters.find(c => c.id === DB.activeId)){
    DB.activeId = campaignChars()[0]?.id || DB.characters[0].id;
  }
  C = activeChar();
  renderTabs();
  renderAll();
  switchTab("combate");
})();
</script>
